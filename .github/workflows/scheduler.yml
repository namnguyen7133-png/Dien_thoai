name: Chạy Nhắc Nhở Sức Khỏe Định Kỳ

on:
  schedule:
    # Lịch chạy: 0:00 UTC mỗi ngày (tương đương 7:00 sáng giờ Việt Nam)
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép bạn bấm nút chạy thử thủ công trên GitHub bất cứ lúc nào

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cho phép GitHub Actions tự động lưu tệp JSON mới lên kho lưu trữ của bạn
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện phụ thuộc
        run: |
          python -m pip install --upgrade pip
          pip install psutil

      - name: Chạy tập lệnh Python
        run: python nhacnhosukhoe.py

      - name: Tự động cập nhật tệp JSON kết quả lên GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scheduler_results.json
          git commit -m "Cập nhật kết quả lịch trình tự động [skip ci]" || echo "Không có thay đổi mới"
          git push
