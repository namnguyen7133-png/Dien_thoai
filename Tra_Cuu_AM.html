cầu\t-', 'Quả me\t-\tOai, khế\t-', 'Dưa bở\t-\tLựu\t-', 'Lê, Đào, Mận\t-\tTrái mít non\t-', 'Chanh\t-', 'Gừng\t-\tNgò\t-', 'Tỏi\t-', 'Bò\t-\tHeo\t-', 'Thỏ\t-\tẾch, nhái\t-', 'Ốc bươu\t-\tCá lờn bơn\t-', 'Hàu, sò\t-\tCá hồi\t-', 'Sữa chua\t-\tFo-mát\t-', 'Cờ-rem (kem)\t-\t* Camembert\t-', 'Cờ-rem Fo-mát\t-\t* Gruyere\t-', 'Việc áp dụng tính âm - dương của thực phẩm vào việc ăn uống hằng ngày có thể được thực hiện bằng cách:', 'Chọn các loại thực phẩm theo mùa: Theo thuyết âm - dương, các loại thực phẩm cũng có tính chất theo mùa. Trong mùa hè (dương), bạn nên ăn nhiều trái cây có tính âm như: dưa hấu, chanh leo, táo….', 'Lựa chọn phương pháp nấu nướng phù hợp: Các phương pháp nấu nướng cũng ảnh hưởng đến tính chất âm - dương của thực phẩm. Vào mùa hè (dương), người Việt thường luộc, nấu cánh, làm nộm, nấu món ăn có nhiều nước (âm) và vị chua (âm) vừa dễ ăn, dễ tiêu hóa vừa giải nhiệt. Vào mùa đông lạnh (âm), người Việt thường xào, rim hoặc kho các món nhiều thịt mỡ (dương) với các gia vị cay như ớt, gừng, tỏi (dương).', 'Tập thể dục để tăng tính dương: Tập thể dục đều đặn giúp tăng cường tuần hoàn máu, giảm căn thẳng và tạo ra sự cân bằng giữa tính chất âm - dương trong cơ thể.', '=> Cách Cân Bằng Âm Dương Trong Ăn Uống - Thực Dưỡng Ohsawa', '1. Nguyên lý âm - dương trong thực phẩm là gì?', '2. Cách ứng dụng tính âm - dương trong ăn uống', 'Dân gian Việt Nam có câu “có thực mới vực được đạo” nhưng cũng có câu “trăm bệnh cũng từ miệng”, do vậy, mỗi người cần biết ăn như thế nào và ăn ra sao để hạn chế được bệnh tật. Chế độ ăn uống đảm bảo tính âm - dương sẽ ảnh hưởng trực tiếp đến việc phòng, điều trị bệnh tật và duy trì một sức khoẻ tốt cho mỗi người ngoài chế độ ăn uống dinh dưỡng. Hãy cùng TS.BS Ngô Quang Hải, Ủy viên thường vụ Hội châm cứu Việt Nam giải đáp những thắc mắc xung quanh việc ứng dụng tính âm dương trong ăn uống hằng ngày trong bài viết này.', 'Nguyên lý âm - dương trong thực phẩm là gì?', 'Nguyên lý âm - dương trong thực phẩm là gì?', 'Nguyên lý âm - dương trong thực phẩm là gì?', 'Cách ứng dụng tính âm - dương trong ăn uống', 'Trên thực tế, hầu hết chúng ta vẫn ứng dụng tính âm - dương trong nhiều món ăn hàng ngày mà không hề am hiểu về thuyết âm dương trong ăn uống. Ví dụ, gừng mang tính dương có tác dụng giải cảm, thanh hàn dùng làm gia vị với thực phẩm có tính hàn (âm) như cá, rau cải, bí đao. Ớt cũng là loại tính nhiệt (dương) thường được dùng cùng với các loại hải sản hay rau răm tính nhiệt (dương) thì thường ăn kèm với trứng vịt lộn (mang tính âm),...', 'Bạn có thể ứng dụng tính âm - dương trong ăn uống hằng ngày bằng cách:', 'Chọn thực phẩm sử dụng theo mùa: Theo thuyết âm dương thì các loại thực phẩm cũng có tính chất theo mùa. Lựa chọn sử dụng thực phẩm theo mùa sẽ góp phần tạo nên sự cân bằng âm - dương trong chế độ dinh dưỡng của bạn. Ví dụ trong mùa hè (tính dương) bạn có thể ăn nhiều trái cây thuộc tính âm như chanh leo, táo, dưa hấu,...', 'Áp dụng phương pháp nấu nướng phù hợp trong mỗi bữa ăn cũng là một trong những yếu tố ảnh hưởng đến tính chất âm - dương của thực phẩm. Thời tiết mùa đông lạnh (âm), người Việt thường làm các món xào, rim hoặc kho những món ăn có nhiều thịt mỡ với các loại gia vị gừng, ớt, tỏi (dương). Tuy nhiên vào mùa hè (thuộc tính dương) thì người Việt lại thường ăn các món luộc, làm nộm, nấu canh, các món có nhiều nước (âm) và có vị chua (âm) để dễ tiêu hóa, có khả năng giải nhiệt tốt.', 'Cách ứng dụng tính âm - dương trong ăn uống', 'Cách ứng dụng tính âm - dương trong ăn uống', '(- – -) : âm hơn nhiều', '(- -) : âm hơn', '(-) : âm', '(-) Một âm: Bắp (corn), Nếp lứt (sticky rice), Hắc mạch (rye), Đại mạch (barley), Yến mạch (Oat), Lúa mì tấm (craked wheat), Lúa mì (wheat), Hạt Kê (millet),', '(- – -) Âm hơn nhiều: Đậu nành (soy bean), Đậu phộng (peanut)', '(- -) Âm hơn: Đậu đen (black bean)', '(-) Âm: Đậu trắng (white bean), Đậu xanh (green bean)', '(– – -) Ba âm: Cà chua, Khoai lang ,Khoai tây, Nấm, Ớt chuông, Các loại đậu (trừ đậu đỏ), Dưa chuột, Măng tây, Rau bó xôi, A ương, được sử dụng để giải cảm và thanh hàn, thường được dùng làm gia vị cùng các món ăn có tính hàn (âm) như cá, rau cải, bí đao. Ớt, một loại thực phẩm tính nhiệt (dương), thường được kết hợp với hải sản và rau răm cũng có tính nhiệt (dương), thường được ăn kèm với trứng vịt lộn, có tính âm. Sự kết hợp này giúp hòa hoãn những tác dụng không mong muốn của các thực phẩm như cá, thịt hay rau.', 'Để áp dụng phương pháp ăn uống cân bằng âm dương hằng ngày, bạn có thể cân bằng giữa thực phẩm âm và dương trong mỗi bữa ăn. Ví dụ, kết hợp các loại rau củ (dương) với thịt (âm) để đảm bảo cân bằng dinh dưỡng và hương vị. Ngoài ra, lựa chọn sử dụng thực phẩm theo mùa cũng góp phần tạo nên sự cân bằng âm - dương trong chế độ dinh dưỡng. Ví dụ, trong mùa hè (tính dương), bạn có thể ăn nhiều trái cây như chanh leo, táo, dưa hấu, thuộc tính âm, để giải nhiệt và làm mát cơ thể.', 'Đặc biệt, phương pháp nấu nướng cũng ảnh hưởng đến tính chất âm - dương của thực phẩm. Vào mùa đông lạnh (âm), người Việt thường chuộng các món xào, rim hoặc kho có nhiều thịt mỡ và gia vị như gừng, ớt, tỏi (dương). Trong khi đó, vào mùa hè (tính dương), họ thường ưa chuộng các món luộc, nấu canh, nấm, làm nộm với nhiều nước (âm) và vị chua (âm) để giúp dễ tiêu hóa và giải nhiệt tốt. Những phương pháp này không chỉ giúp cân bằng dinh dưỡng mà còn tạo ra một cơ thể khỏe mạnh và hài hòa với sự cân bằng tự nhiên của nó.', 'Những nguyên tắc này giúp người tiêu dùng lựa chọn và kết hợp thực phẩm một cách hợp lý, nhằm đảm bảo cân bằng âm - dương trong chế độ ăn uống, từ đó tối ưu hóa sức khỏe và cân bằng năng lượng trong cơ thể.', 'PHẦN 1 - Nguyên lý Âm và Dương trong Thực dưỡng Ohsawa', 'Âm : đường trắng -> giấm -> đường tinh luyện -> rượu -> dầu ăn ->  mật ong -> hoa quả -> nấm -> đậu phụ -> nước -> hạt> đậu -> rau -> rong biển -> ngũ cốc -> sò hến -> cá sông -> xì dầu -> tương đậu miso -> cá biển -> muối biển -> chim -> bò lợn -> trứng -> muối tinh chế : Dương', 'Âm: Cay -> chua -> ngọt -> mặn -> đắng -> Chát : Dương', 'Âm : Tia cực tím -> tím -> chàm -> xanh da trời -> xanh lá cây -> trắng -> vàng -> cam -> đỏ -> nâu -> đen -> tia hồng ngoại: Dương', 'Nhìn vào màu sắc thì lá củ cải có màu xanh và củ thì màu trắng. Dựa vào bảng "Âm dương của màu sắc" có thể thấy màu xanh âm tính hơn màu trắng. Tiếp đến về cách sinh trưởng thì phần lá khi phát triển thì vươn lên trên còn phần rễ thì đâm xuống lòng đất. Theo bảng so sánh “Âm dương trong mọi vật” -mục 6 thì vươn trồi lên trên là âm, còn đâm xuống lòng đất là dương.', 'Nguyên lý âm dương phần 2 - Phán đoán âm dương: Cái nào âm ? Cái nào dương ?', 'Sử dụng thuyết âm - dương trong ẩm thực hợp lý', 'Máy Hút Mùi Kính Vát FZ-900 UNICE', '679\t▼ - Bo bo (ý dĩ), bắp (ngô)\t72\tSản Phẩm Sữa', '699\t#N/A\t207\t(- -) : âm hơn', '700\t#N/A\t225\t(-) : âm', '708\t#N/A\t757\t(- -) Âm hơn: Đậu đen (black bean)', '709\t#N/A\t763\t(-) Âm: Đậu trắng (white bean), Đậu xanh (green bean)', '(-3) Ba âm: Cà chua, Khoai lang ,Khoai tây, Nấm, Ớt chuông, Các loại đậu (trừ đậu đỏ), Dưa chuột, Măng tây, Rau bó xôi, A ti sô, Măng tre, Giá, Bắp chuối, Hoa thiên lý, Trái vảKhoai mì, Khoai sọ, Mứt biển', '(- -) Hai âm: Đậu Hà Lan, Cần tây, Đậu lăng, Đậu ngự, Rau sam, Mồng tơi, Bí đao, Mướp, Củ sắn nước, Hoa bí, Hoa mướp, Trái su, Hoa ac ti sô, Khoai mỡ tím, Khoai từ, Củ dền', '(-) Một âm: Bắp cải tím, Củ cải đường, Bắp cải trắng (, Khổ qua, Bầu, Mít non, Su hào, Rau dền, Mã đề, Rau lang, Rau muống, Bồ ngót, Lá ạc ti sô, Khoai mỡ trắng', '(-) Âm: Con hàu, Sò, Bạch tuộc, Lươn, Cá chép, Con trai đen, Cá lưỡi trâu, Tôm hùm, Cá hường, Cá thờn bơn', '(- -) Âm hơn: Ốc, Ếch, Thịt heo, Thịt bò, Thịt ngựa, Thịt thỏ rừng', '(-) Âm: Gà ta', '(- – -) Âm hơn nhiều : Sữa chua (yogurt), Kem chua (sour cream), Kem ngọt (sweet cream), Phô mai kem (cream cheese), Bơ (butter), Váng sữa', '(- -) Âm hơn: Sữa (milk).\xa0Phô mai Camembert, Phô mai Gruyere', '(- – -) Âm hơ i, thứ nào nặng hơn thì dương hơn, thứ nào nước nhiều hơn thì âm hơn.\t\t\t\t\t\t\t-\t#ERROR!', '- Màu sắc xếp theo thứ tự sắc cầu vồng, từ dương đến âm là đỏ, da cam, lục, lam, chàm, tím, đen.\xa0Ví dụ: củ cải đỏ dương hơn củ cải trắng, bí đỏ dương hơn cà tím.', '- Từ dương đến âm là các vị mặn – đắng – chát – chua – ngọt.\xa0Ví dụ: khổ qua (mướp đắng) dương hơn các loại trái cây ngọt.\xa0Muối là dương, đường là âm.', '- Cách mọc có hướng đâm xuống thì dương hơn đâm ngang, đâm ngang thì dương hơn hướng tỏa lên.\xa0Ví dụ: củ cà rốt đâm xuống thì dương hơn củ khoai mì (sắn) đâm ngang, rau má bò ngang thì dương hơn rau xà lách mọc hướng lên.', '- Thịt dê nóng, thịt cầy ấm; thịt vịt, ngan mát nhưng nếu ăn cùng lúc 2 món có tính khí dị đồng sẽ bị tác động ngộ độc hoặc bệnh tỳ, vị.', '- Thủy, hải sản như cua, tôm, ốc, ba ba, rùa, sam tính lạnh, mát, không nên ăn nhiều vào buổi tối.', '- Loại da mềm, da trơn như cá diếc, cá trắm cỏ, cá basa, cá tra tính ấm hoặc nóng, không nên ăn nhiều vào buổi sáng.', '- Nếu bạn ăn quá dương thì cơ thể sẽ bị gầy và thường bị bón.\t\t\t\t\t\t\t\t#ERROR!', '- Nếu bạn ăn quá âm thì rất dễ sinh bệnh, các chứng bệnh vốn không phát ngay mà thường ủ lâu trong cơ thể.\t\t\t\t\t\t\t-', '- Việt nam là vùng có khí hậu nhiệt đới, có ánh sáng mặt trời nhiều tức là dương nên thực phẩm âm phát triển nhiều, đó là sự quân bình âm dương của thiên nhiên nhưng do chúng ta hoặc không biết cách hoặc quá lạm dụng đồ âm có sẵn nên dễ sinh các loại bệnh âm, các chứng bệnh liên quan đến lục phủ ngũ tạng.', '- Để biết được bữa ăn của mình âm hay dương thì có thể nhìn phân lúc đi ngoài, bị bón thì dương quá, phân lỏng có màu xanh hoặc thẫm thì âm quá, lúc này phải điều tiết lại ăn uống, phân màu vàng, chặt thì tốt.', 'Tóm lại, ta nên ăn uống quân bình âm dương theo công thức: 70% là cơm gạo, 30% là thức ăn.\xa0Ăn ‘dè’ 1 miếng thức ăn với 3, 4 miếng cơm, nhai thật kĩ để dịch vị tiết ra giúp cơ thể hấp thụ tốt, ăn đúng giờ, khi ăn phải tập trung, không ăn quá no, khô
