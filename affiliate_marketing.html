<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; padding: 20px;">
    <h2>Tinh toan Loi nhuan Affiliate</h2>
    <p>Nhap cac thong so de xem ban co dang lo hay lai:</p>
    
    <label>So luot click (Traffic):</label><br>
    <input type="number" id="traffic" value="1000"><br><br>
    
    <label>Ti le chuyen doi (%):</label><br>
    <input type="number" id="conversion" value="2"><br><br>
    
    <label>Hoa hong moi don ($):</label><br>
    <input type="number" id="commission" value="50"><br><br>
    
    <label>Chi phi moi click (CPC - $):</label><br>
    <input type="number" id="cpc" value="0.5"><br><br>
    
    <button onclick="tinhToan()">Tinh loi nhuan</button>
    <h3 id="ketqua"></h3>

    <script>
        function tinhToan() {
            let t = document.getElementById('traffic').value;
            let c = document.getElementById('conversion').value / 100;
            let comm = document.getElementById('commission').value;
            let cpc = document.getElementById('cpc').value;
            
            let donHang = t * c;
            let doanhThu = donHang * comm;
            let chiPhi = t * cpc;
            let loiNhuan = doanhThu - chiPhi;
            
            document.getElementById('ketqua').innerText = "Loi nhuan rong cua ban la: $" + loiNhuan.toFixed(2);
        }
    </script>
</body>
</html>
