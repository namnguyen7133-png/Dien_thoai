    <style>
        /* Modern Dark Theme Base Setup */
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Continuous Auto Scroll Animation */
        #menuContainer {
            will-change: transform;
        }

        .scrolling-active #menuContainer {
            animation: scrollUp var(--scroll-speed, 90s) linear infinite;
        }

        .scrolling-paused #menuContainer {
            animation-play-state: paused !important;
        }

        @keyframes scrollUp {
            0% {
                transform: translateY(100vh);
            }
            100% {
                transform: translateY(-100%);
            }
        }

        /* Glassmorphism Control Bar */
        .glass-panel {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }

        /* Item Row Gradient Accent */
        .item-row {
            transition: all 0.2s ease;
        }
        .item-row:hover {
            background-color: rgba(31, 41, 55, 0.8);
        }
        
        /* Fixed Header Table Glow */
        .price-col {
            color: #4ade80;
            font-weight: 700;
            font-family: 'Courier New', Courier, monospace;
        }
        .stt-col {
            color: #fbbf24;
            font-weight: 700;
        }
    </style>
</head>

                    <i id="toggleIcon" class="fas fa-pause"></i>
                    <span id="toggleText" class="hidden sm:inline">Tạm dừng</span>
                </button>

                <!-- Speed Control Slider -->
                <div class="flex items-center space-x-1.5 bg-gray-900/90 border border-gray-700/60 rounded-lg px-2.5 py-1 text-xs">
                    <i class="fas fa-tachometer-alt text-amber-400 hidden sm:inline"></i>
                    <span class="text-gray-400 text-[11px] sm:text-xs">Tốc độ:</span>
                    <input type="range" id="speedSlider" min="20" max="240" value="90" oninput="changeSpeed(this.value)" class="w-16 sm:w-24 accent-amber-400 cursor-pointer">
                    <span id="speedVal" class="text-amber-400 font-mono font-bold w-7 text-right">90s</span>
                </div>

                <!-- Font Size Controls -->
                <div class="flex items-center bg-gray-900/90 border border-gray-700/60 rounded-lg p-1 text-xs space-x-1">
                    <button onclick="changeFontSize(-1)" class="w-7 h-7 flex items-center justify-center hover:bg-gray-800 rounded text-gray-300 active:bg-gray-700">A-</button>
                    <button onclick="changeFontSize(1)" class="w-7 h-7 flex items-center justify-center hover:bg-gray-800 rounded text-gray-300 active:bg-gray-700 font-bold">A+</button>
                </div>

                <!-- Fast Nav Buttons -->
                <div class="flex items-center space-x-1">
                    <button onclick="scrollToTop()" title="Lên đầu" class="p-1.5 sm:p-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg border border-gray-700 active:scale-95 text-xs sm:text-sm">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                    <button onclick="scrollToBottom()" title="Xuống cuối" class="p-1.5 sm:p-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg border border-gray-700 active:scale-95 text-xs sm:text-sm">
                        <i class="fas fa-arrow-down"></i>
                    </button>
                </div>

            </div>
        </div>
    </header>

        let isScrolling = true;
        let currentFontSize = 15; // base font size in px

        // Render HTML content dynamically
        function renderMenu() {
            const container = document.getElementById('menuContainer');
            let html = '';

            menuData.forEach((part, index) => {
                html += `
                    <div class="mb-10">
                        <!-- Section Banner Header -->
                        <div class="sticky top-0 z-10 py-3 px-4 bg-gradient-to-r from-amber-600/90 via-amber-500/90 to-amber-700/90 text-gray-950 font-extrabold text-sm sm:text-base rounded-xl shadow-lg border border-amber-300/30 uppercase tracking-wide my-4 text-center">
                            ${part.section}
                        </div>

                        <!-- Item Grid Rows -->
                        <div class="space-y-1.5">
                `;

                part.items.forEach(item => {
                    html += `
                        <div class="item-row grid grid-cols-12 gap-2 items-center px-3 py-2.5 rounded-lg border border-gray-800/60 bg-gray-900/40">
                            <!-- Column 1: Price -->
                            <div class="col-span-3 price-col text-left font-mono tracking-tight text-xs sm:text-sm">
                                ${item.price}
                            </div>
                            
                            <!-- Column 2: STT -->
                            <div class="col-span-2 stt-col text-center font-bold text-xs sm:text-sm">
                                ${item.stt}
                            </div>
                            
                            <!-- Column 3: Item Name -->
                            <div class="col-span-7 text-left font-medium text-gray-100 leading-snug truncate sm:whitespace-normal">
                                ${item.name}
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Toggle Scroll State
        function toggleScroll() {
            const viewport = document.getElementById('scrollViewport');
            const toggleIcon = document.getElementById('toggleIcon');
            const toggleText = document.getElementById('toggleText');
            const statusDot = document.getElementById('statusDot');

            if (isScrolling) {
                viewport.classList.remove('scrolling-active');
                viewport.classList.add('scrolling-paused');
                toggleIcon.className = 'fas fa-play';
                toggleText.innerText = 'Tiếp tục';
                statusDot.className = 'w-3 h-3 rounded-full bg-rose-500';
                isScrolling = false;
            } else {
                viewport.classList.remove('scrolling-paused');
                viewport.classList.add('scrolling-active');
                toggleIcon.className = 'fas fa-pause';
                toggleText.innerText = 'Tạm dừng';
                statusDot.className = 'w-3 h-3 rounded-full bg-emerald-500 animate-pulse';
                isScrolling = true;
            }
        }

        // Handle Click anywhere on container to toggle pause/play
        function handleContainerClick() {
            toggleScroll();
        }

        // Change Animation Speed
        function changeSpeed(val) {
            document.documentElement.style.setProperty('--scroll-speed', `${val}s`);
            document.getElementById('speedVal').innerText = `${val}s`;
        }

        // Change Font Size
        function changeFontSize(delta) {
            currentFontSize = Math.max(12, Math.min(22, currentFontSize + delta));
            document.getElementById('scrollViewport').style.fontSize = `${currentFontSize}px`;
        }

        // Scroll to Top
        function scrollToTop() {
            const container = document.getElementById('menuContainer');
            const viewport = document.getElementById('scrollViewport');
            
            // Temporary disable keyframe animation to force position
            viewport.classList.remove('scrolling-active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            setTimeout(() => {
                if (isScrolling) {
                    viewport.classList.add('scrolling-active');
                }
            }, 500);
        }

        // Scroll to Bottom
        function scrollToBottom() {
            const viewport = document.getElementById('scrollViewport');
            viewport.classList.remove('scrolling-active');
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        // Initialize Page Load
        window.addEventListener('DOMContentLoaded', () => {
            renderMenu();
            changeSpeed(90); // default speed 90 seconds
        });
    </script>
