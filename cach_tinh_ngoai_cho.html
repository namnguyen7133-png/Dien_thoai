<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tinh nham hang ngay – Kieu di cho</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f5f7;
    padding:20px;
}
.box{
    max-width:900px;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}
h2{text-align:center;color:#2c3e50}
input,select,button{
    width:100%;
    padding:8px;
    margin:6px 0;
}
button{
    background:#e67e22;
    color:#fff;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
button:hover{background:#cf711c}
.result{
    margin-top:15px;
    background:#fff4e6;
    padding:15px;
    border-radius:5px;
    line-height:1.7;
}
</style>
</head>

<body>
<div class="box">
<h2>🧮 TINH NHAM HANG NGAY – KIEU NGOAI CHO</h2>

<label>Chon meo tinh</label>
<select id="type">
    <option value="addkeep">1⃣ Cong don & giu so</option>
    <option value="roundsum">2⃣ Cong gop so tron</option>
    <option value="splitmul">3⃣ Tach so tinh tien</option>
    <option value="double">4⃣ Nhan bang gap doi (4–8–16)</option>
</select>

<label>Nhap day so (cach nhau bang dau phay)</label>
<input id="nums" placeholder="Vi du: 17,8,12,5">

<label>Gia / so nhan (neu co)</label>
<input id="price" placeholder="Vi du: 23500 hoac de trong">

<label>He so nhan (4 / 8 / 16 – chi dung cho meo 4)</label>
<input id="mul" placeholder="Vi du: 8">

<button onclick="calc()">Tinh & Giai thich</button>

<div id="out" class="result"></div>
</div>

<script>
function calc(){
    let type=document.getElementById("type").value;
    let nums=document.getElementById("nums").value.split(",").map(x=>parseFloat(x));
    let price=parseFloat(document.getElementById("price").value);
    let mul=parseInt(document.getElementById("mul").value);
    let o="";

    if(nums.some(isNaN)){
        out.innerHTML="⚠ Nhap dung day so";
        return;
    }

    // 1. Cong don giu so
    if(type==="addkeep"){
        let sum=0;
        o+="<b>Cong don & giu so</b><br><br>";
        nums.forEach(n=>{
            let old=sum;
            sum+=n;
            o+=`${old} + ${n} = <b>${sum}</b> → nhan: "${sum}, ${sum}, ${sum}"<br>`;
        });
        o+=`<br><b>Tong cuoi: ${sum}</b>`;
    }

    // 2. Gop so tron
    if(type==="roundsum"){
        let used=[...nums];
        let sum=0;
        o+="<b>Cong gop so tron</b><br><br>";
        used.sort((a,b)=>b-a);
        while(used.length){
            let a=used.shift();
            let found=false;
            for(let i=0;i<used.length;i++){
                if((a+used[i])%10===0){
                    o+=`Gop ${a} + ${used[i]} = <b>${a+used[i]}</b><br>`;
                    sum+=a+used[i];
                    used.splice(i,1);
                    found=true;
                    break;
                }
            }
            if(!found){
                o+=`Cong le: ${a}<br>`;
                sum+=a;
            }
        }
        o+=`<br><b>Tong: ${sum}</b>`;
    }

    // 3. Tach so tinh tien
    if(type==="splitmul"){
        if(isNaN(price)){
            out.innerHTML="⚠ Nhap gia";
            return;
        }
        let qty=nums[0];
        let round=Math.round(qty);
        let diff=round-qty;

        o+=`<b>Tinh tien ${qty} × ${price}</b><br><br>`;
        o+=`Tach so:<br>`;
        o+=`${round} × ${price} = ${round*price}<br>`;
        if(diff!==0){
            o+=`Tru lai ${diff} × ${price} = ${diff*price}<br>`;
        }
        o+=`<br><b>Thanh tien: ${qty*price}</b>`;
    }

    // 4. Nhan gap doi
    if(type==="double"){
        let n=nums[0];
        if(![4,8,16].includes(mul)){
            out.innerHTML="⚠ Chi ho tro 4, 8, 16";
            return;
        }
        o+=`<b>${n} × ${mul}</b><br><br>`;
        let times=Math.log2(mul);
        let cur=n;
        for(let i=1;i<=times;i++){
            cur*=2;
            o+=`Gap doi lan ${i}: ${cur}<br>`;
        }
        o+=`<br><b>Ket qua: ${cur}</b>`;
    }

    out.innerHTML=o;
}
</script>

<script>
window.onload = function() {
    setTimeout(() => {
        // Tu bam nut tinh toan
        const btn = document.querySelector('button') || document.querySelector('.btn-primary');
        if(btn) btn.click();
        
        setTimeout(() => {
            const text = document.body.innerText;
            const dacBiet = ["307", "14", "41", "27", "72", "627", "168"];
            let found = dacBiet.filter(s => text.includes("so " + s) || text.includes("Ket qua " + s));

            if (found.length > 0) {
                fetch('https://api.pushbullet.com/v2/pushes', {
                    method: 'POST',
                    headers: { 'Access-Token': 'o.dvjnPqSpLbPFkvPFAQEx9lvHjDQyhfJ2', 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'note',
                        title: '⚠ BAO dONG: ' + document.title,
                        body: 'Thay so: ' + found.join(", ")
                    })
                });
            }
        }, 5000);
    }, 2000);
};
</script>
</body>
</html>
