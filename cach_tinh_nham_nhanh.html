<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tinh nham nhanh – Giai thich tung buoc</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 20px;
}
.container {
    max-width: 800px;
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}
h2 {
    text-align: center;
    color: #2c3e50;
}
input, select, button {
    padding: 8px;
    margin: 5px 0;
    width: 100%;
}
button {
    background: #3498db;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
button:hover {
    background: #2980b9;
}
.result {
    margin-top: 15px;
    background: #eef9ff;
    padding: 15px;
    border-radius: 5px;
    line-height: 1.6;
}
.step {
    margin-left: 10px;
}
</style>
</head>

<body>
<div class="container">
<h2>📘 TINH NHAM NHANH – THEO MEO VIDEO</h2>

<label>So thu nhat</label>
<input type="number" id="a">

<label>So thu hai</label>
<input type="number" id="b">

<label>Chon phuong phap</label>
<select id="method">
    <option value="sub">➖ Tru – Muon de triet tieu</option>
    <option value="add">➕ Cong – Lam tron chuc</option>
    <option value="near100">✖ Nhan gan 100</option>
    <option value="over100">✖ Nhan lon hon 100</option>
    <option value="sameTen">✖ Nhan cung hang chuc</option>
    <option value="diffTen">✖ Nhan khac hang chuc</option>
</select>

<button onclick="calculate()">Tinh & Giai thich</button>

<div id="output" class="result"></div>
</div>

<script>
function calculate() {
    let a = parseInt(document.getElementById("a").value);
    let b = parseInt(document.getElementById("b").value);
    let method = document.getElementById("method").value;
    let out = "";

    if (isNaN(a) || isNaN(b)) {
        document.getElementById("output").innerHTML = "⚠ Vui long nhap du 2 so";
        return;
    }

    if (method === "sub") {
        let d = (10 - (a - b) % 10) % 10;
        out += `<b>${a} - ${b}</b><br>`;
        out += `Muon ${d} de triet tieu hang don vi<br>`;
        out += `${a + d} - ${b} = ${(a + d) - b}<br>`;
        out += `Tra lai ${d}: ${(a + d) - b} - ${d} = <b>${a - b}</b>`;
    }

    if (method === "add") {
        let d = 10 - (a % 10);
        out += `<b>${a} + ${b}</b><br>`;
        out += `Lam tron: ${a} + ${d} = ${a + d}<br>`;
        out += `${a + d} + ${b} = ${a + b + d}<br>`;
        out += `Tra ${d}: ${a + b + d} - ${d} = <b>${a + b}</b>`;
    }

    if (method === "near100") {
        let x = 100 - a;
        let y = 100 - b;
        out += `<b>${a} × ${b}</b><br>`;
        out += `Thieu: ${x} va ${y}<br>`;
        out += `Hai so cuoi: ${x} × ${y} = ${x * y}<br>`;
        out += `Hai so dau: ${a} - ${y} = ${a - y}<br>`;
        out += `Ket qua: <b>${a - y}${String(x * y).padStart(2,"0")}</b>`;
    }

    if (method === "over100") {
        let x = a - 100;
        let y = b - 100;
        out += `<b>${a} × ${b}</b><br>`;
        out += `Thua: ${x} va ${y}<br>`;
        out += `Hai so cuoi: ${x} × ${y} = ${x * y}<br>`;
        out += `Hai so dau: ${a} + ${y} = ${a + y}<br>`;
        out += `Ket qua: <b>${a + y}${String(x * y).padStart(2,"0")}</b>`;
    }

    if (method === "sameTen") {
        let ten = Math.floor(a / 10);
        let u1 = a % 10;
        let u2 = b % 10;
        out += `<b>${a} × ${b}</b><br>`;
        out += `( ${a} + ${u2} ) × ${ten * 10} = ${(a + u2) * (ten * 10)}<br>`;
        out += `${u1} × ${u2} = ${u1 * u2}<br>`;
        out += `Cong lai: <b>${(a + u2) * (ten * 10) + (u1 * u2)}</b>`;
    }

    if (method === "diffTen") {
        let a1 = Math.floor(a / 10), a2 = a % 10;
        let b1 = Math.floor(b / 10), b2 = b % 10;

        let unit = a2 * b2;
        let ten = a1 * b2 + a2 * b1;
        let hundred = a1 * b1;

        out += `<b>${a} × ${b}</b><br>`;
        out += `Hang don vi: ${a2} × ${b2} = ${unit}<br>`;
        out += `Hang chuc: (${a1}×${b2}) + (${a2}×${b1}) = ${ten}<br>`;
        out += `Hang tram: ${a1} × ${b1} = ${hundred}<br>`;
        out += `Ket qua: <b>${a * b}</b>`;
    }

    document.getElementById("output").innerHTML = out;
}
</script>

</body>
</html>
