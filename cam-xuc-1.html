            --secondary: #2575fc;
            --accent: #ff4d94;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
        }
        
        body {

            padding-bottom: 80px;
        }
        
        .container {

            padding: 0 15px;
        }
        
        header {

            padding: 20px 15px 10px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 0 0 25px 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(106, 17, 203, 0.3), rgba(37, 117, 252, 0.3));

        .subtitle {

            color: #b0b0ff;
            margin-bottom: 15px;
        }
        
        .stats {

            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;

        .stat-item {
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);

        .search-box {
            position: relative;
            margin: 15px auto;
            max-width: 500px;
        }
        
        .search-box input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            border-radius: 50px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 1rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        
        .search-box input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 5px 20px rgba(106, 17, 203, 0.4);
        }
        
        .search-box i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #b0b0ff;
            font-size: 1.2rem;
        }
        
        .tabs-container {
            position: relative;
            margin-bottom: 15px;
        }
        
        .tabs-scroll-btn {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 40px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            font-size: 1.5rem;
            z-index: 10;
            display: none;
        }
        
        .tabs-scroll-btn.left {
            left: 0;
        }
        
        .tabs-scroll-btn.right {
            right: 0;
        }
        
        .tabs {
            display: flex;
            overflow-x: auto;
            padding: 10px 0;
            gap: 10px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .tabs::-webkit-scrollbar {
            display: none;
        }
        
        .tab {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            flex-shrink: 0;
        }
        
        .tab.active {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.4);
            transform: translateY(-2px);
        }
        
        .tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .content {
            display: none;
        }
        
        .content.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .song-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 65vh;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .song-list::-webkit-scrollbar {
            width: 6px;
        }
        
        .song-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        .song-list::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, #6a11cb, #2575fc);
            border-radius: 10px;
        }
        
        .song-card {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 15px;
            padding: 18px;
            transition: all 0.3s ease;
            border-left: 5px solid transparent;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }
        
        .song-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.03), transparent);
            transform: translateX(-100%);
        }
        
        .song-card:hover::before {
            animation: shine 1.5s ease;
        }
        
        @keyframes shine {
            100% { transform: translateX(100%); }
        }
        
        .song-card:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border-left-color: var(--accent);
        }
        
        .song-card.playing {
            border-left-color: #ff4d94;
            background: rgba(255, 77, 148, 0.1);
        }
        
        .song-number {
            display: inline-block;
            width: 28px;
            height: 28px;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-weight: bold;
            margin-right: 10px;
            font-size: 0.9rem;
            box-shadow: 0 3px 8px rgba(106, 17, 203, 0.4);
        }
        
        .song-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: white;
        }
        
        .song-info-row {

            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        
        .song-artist {

            color: #b0b0ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        }

            font-size: 0.85rem;
            color: #ffd966;
            border: 1px solid rgba(255, 193, 7, 0.3);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .song-country {

            padding: 3px 10px;
            background: rgba(37, 117, 252, 0.2);
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: #80b0ff;
            border: 1px solid rgba(37, 117, 252, 0.3);
        }

            gap: 8px;

        }

            background: rgba(255, 77, 148, 0.15);
            border-radius: 20px;
            font-size: 0.85rem;
            color: #ff99c2;
            border: 1px solid rgba(255, 77, 148, 0.3);
        }

            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-left: 10px;
        }
        
        .bpm-bar {
            width: 80px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        
        .bpm-fill {
            height: 100%;
            background: linear-gradient(to right, #28a745, #ffc107, #dc3545);

        }

        }

            margin-bottom: 15px;
            color: #6a11cb;
        }
        
        .country-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

            display: flex;

            color: white;
            border-color: #6a11cb;
        }
        
        .country-btn:hover:not(.active) {

        }

            bottom: 0;
            left: 0;
            width: 100%;

            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 100;

        .player {

            align-items: center;
            justify-content: space-between;

            margin: 0 auto;

            font-size: 0.8rem;
            color: #b0b0ff;
        }
        
        .player-controls {

            gap: 15px;
        }
        
        .player-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.4);
            transition: all 0.3s ease;
        }
        
        .player-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(106, 17, 203, 0.6);
        }

        }

            border-radius: 3px;

            }
            
            .tabs {

                font-size: 0.9rem;
            }
            
            .stats {

            .stat-item {

                font-size: 0.8rem;
            }
            
            .song-info-row {

                align-items: flex-start;
                gap: 8px;
            }

        @media (max-width: 480px) {

            }

            }

            }

            }

            }
            
            .country-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }

                padding: 4px 10px;
            }
        }
    </style>
</head>

                {id: 75, title: "Sai Gon dau Long Qua", artist: "Hua Kim Tuyen ft. Hoang Duyen", country: "Viet Nam", emotions: ["Buon ba", "tiec nuoi"], bpm: 85}
            ],
            "Hy vong": [
                {id: 76, title: "Tage wie diese", artist: "Die Toten Hosen", country: "duc", emotions: ["Vui ve", "doan ket", "hy vong"], bpm: 132},
                {id: 77, title: "Irgendwie, Irgendwo, Irgendwann", artist: "Nena", country: "duc", emotions: ["Lang man", "mo mong", "hy vong"], bpm: 112},
                {id: 78, title: "Euphoria", artist: "Loreen", country: "Thuy dien", emotions: ["Hung phan", "hy vong", "manh liet"], bpm: 138},
                {id: 79, title: "L’Amour Existe Encore", artist: "Celine Dion", country: "Phap", emotions: ["Hy vong", "cam xuc sau sac"], bpm: 118},
                {id: 80, title: "Parce qu'on vient de loin", artist: "Corneille", country: "Phap", emotions: ["Cam hung", "vuot kho"], bpm: 125}
            ]
        };

        // Lay tat ca cac cam xuc duy nhat
        const allEmotions = Object.keys(songsByEmotion);
        
        // Bien toan cuc
        let currentEmotion = allEmotions[0];
        let currentSongIndex = 0;
        let currentSongList = [];
        let isPlaying = false;
        let searchTerm = "";
        let selectedCountry = "Tat ca";
        
        // Khoi tao trang
        document.addEventListener('DOMContentLoaded', function() {
            renderStats();
            renderCountryFilter();
            renderTabs();
            renderContent(currentEmotion);
            setupEventListeners();
            updateScrollButtons();
        });
        
        // Hien thi thong ke
        function renderStats() {
            let totalSongs = 0;
            let totalBpm = 0;
            
            allEmotions.forEach(emotion => {
                songsByEmotion[emotion].forEach(song => {
                    totalSongs++;
                    totalBpm += song.bpm || 0;
                });
            });
            
            const avgBpm = totalSongs > 0 ? Math.round(totalBpm / totalSongs) : 0;
            
            document.getElementById('totalSongs').textContent = `${totalSongs} bai hat`;
            document.getElementById('avgBpm').textContent = `~${avgBpm} BPM`;
            document.getElementById('totalEmotions').textContent = `${allEmotions.length} cam xuc`;
        }
        
        // Render bo loc quoc gia
        function renderCountryFilter() {
            const countryFilter = document.getElementById('countryFilter');
            countryFilter.innerHTML = '';
            
            // Lay tat ca cac quoc gia duy nhat
            const countries = new Set();
            allEmotions.forEach(emotion => {
                songsByEmotion[emotion].forEach(song => {
                    countries.add(song.country);
                });
            });
            
            // Them nut "Tat ca"
            const allBtn = document.createElement('button');
            allBtn.className = selectedCountry === "Tat ca" ? 'country-btn active' : 'country-btn';
            allBtn.innerHTML = '<i class="fas fa-globe"></i> Tat ca';
            allBtn.dataset.country = "Tat ca";
            allBtn.addEventListener('click', () => filterByCountry("Tat ca"));
            countryFilter.appendChild(allBtn);
            
            // Them nut cho tung quoc gia
            Array.from(countries).sort().forEach(country => {
                const countryBtn = document.createElement('button');
                countryBtn.className = selectedCountry === country ? 'country-btn active' : 'country-btn';
                countryBtn.innerHTML = `<i class="fas fa-flag"></i> ${country}`;
                countryBtn.dataset.country = country;
                countryBtn.addEventListener('click', () => filterByCountry(country));
                countryFilter.appendChild(countryBtn);
            });
        }
        
        // Loc theo quoc gia
        function filterByCountry(country) {
            selectedCountry = country;
            renderCountryFilter();
            renderContent(currentEmotion);
        }
        
        // Render cac tab cam xuc
        function renderTabs() {
            const tabsContainer = document.getElementById('emotionTabs');
            tabsContainer.innerHTML = '';
            
            allEmotions.forEach(emotion => {
                const tab = document.createElement('div');
                tab.className = emotion === currentEmotion ? 'tab active' : 'tab';
                tab.textContent = emotion;
                tab.dataset.emotion = emotion;
                tab.addEventListener('click', () => switchEmotion(emotion));
                tabsContainer.appendChild(tab);
            });
        }
        
        // Render noi dung theo cam xuc
        function renderContent(emotion) {
            currentEmotion = emotion;
            
            // Cap nhat tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.emotion === emotion);
            });
            
            // Render noi dung
            const contentArea = document.getElementById('contentArea');
            
            // Xoa noi dung cu
            contentArea.innerHTML = '';
            
            // Tao container moi
            const contentDiv = document.createElement('div');
            contentDiv.className = 'content active';
            contentDiv.id = emotion;
            
            // Tao danh sach bai hat
            const songList = document.createElement('div');
            songList.className = 'song-list';
            
            // Lay danh sach bai hat theo cam xuc
            let songs = songsByEmotion[emotion];
            currentSongList = [...songs]; // Sao chep mang
            
            // Loc theo quoc gia neu duoc chon
            if (selectedCountry !== "Tat ca") {
                songs = songs.filter(song => song.country === selectedCountry);
            }
            
            // Loc theo tu khoa tim kiem neu co
            if (searchTerm.trim() !== "") {
                const term = searchTerm.toLowerCase();
                songs = songs.filter(song => 
                    song.title.toLowerCase().includes(term) ||
                    song.artist.toLowerCase().includes(term) ||
                    song.country.toLowerCase().includes(term) ||
                    song.emotions.some(e => e.toLowerCase().includes(term)) ||
                    (song.bpm && song.bpm.toString().includes(term))
                );
            }
            
            // Hien thi ket qua
            if (songs.length === 0) {
                const noResults = document.createElement('div');
                noResults.className = 'no-results';
                noResults.innerHTML = `
                    <i class="fas fa-music"></i>
                    <p>Khong tim thay bai hat nao phu hop</p>
                    <p>Thu thay doi bo loc hoac tu khoa tim kiem</p>
                `;
                songList.appendChild(noResults);
            } else {
                songs.forEach((song, index) => {
                    const songCard = document.createElement('div');
                    songCard.className = 'song-card';
                    songCard.dataset.id = song.id;
                    
                    // Tinh toan phan tram BPM cho thanh hien thi (gia su BPM toi da la 200)
                    const bpmPercent = Math.min((song.bpm / 200) * 100, 100);
                    
                    // Highlight tu khoa tim kiem neu co
                    let title = song.title;
                    let artist = song.artist;
                    let country = song.country;
                    let emotions = song.emotions.join(", ");
                    let bpm = song.bpm ? song.bpm.toString() : "N/A";
                    
                    if (searchTerm.trim() !== "") {
                        const term = searchTerm.toLowerCase();
                        const regex = new RegExp(`(${term})`, 'gi');
                        
                        title = title.replace(regex, '<span class="highlight">$1</span>');
                        artist = artist.replace(regex, '<span class="highlight">$1</span>');
                        country = country.replace(regex, '<span class="highlight">$1</span>');
                        emotions = emotions.replace(regex, '<span class="highlight">$1</span>');
                        bpm = bpm.replace(regex, '<span class="highlight">$1</span>');
                    }
                    
                    songCard.innerHTML = `
                        <div>
                            <span class="song-number">${index + 1}</span>
                            <span class="song-title">${title}</span>
                        </div>
                        <div class="song-info-row">
                            <div class="song-artist">
                                <i class="fas fa-user"></i>
                                <span>${artist}</span>
                            </div>
                            <div class="song-bpm">
                                <i class="fas fa-tachometer-alt"></i>
                                <span>${bpm} BPM</span>
                                <div class="bpm-indicator">
                                    <div class="bpm-bar">
                                        <div class="bpm-fill" style="width: ${bpmPercent}%"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="song-country">
                            <i class="fas fa-globe"></i> ${country}
                        </div>
                        <div class="song-emotions">
                            ${song.emotions.map(emotion => `<span class="emotion-tag">${emotion}</span>`).join('')}
                        </div>
                    `;
                    
                    songCard.addEventListener('click', () => playSong(song, index));
                    songList.appendChild(songCard);
                });
            }
            
            contentDiv.appendChild(songList);
            contentArea.appendChild(contentDiv);
        }
        
        // Chuyen doi cam xuc
        function switchEmotion(emotion) {
            renderContent(emotion);
        }
        
        // Phat bai hat
        function playSong(song, index) {
            currentSongIndex = index;
            
            // Cap nhat player
            document.getElementById('playerTitle').textContent = song.title;
            document.getElementById('playerArtist').textContent = `${song.artist} - ${song.country} (${song.bpm} BPM)`;
            
            // Cap nhat trang thai phat
            const playBtn = document.getElementById('playBtn');
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            isPlaying = true;
            
            // Highlight bai hat dang choi
            document.querySelectorAll('.song-card').forEach(card => {
                card.classList.remove('playing');
            });
            
            const currentCard = document.querySelector(`.song-card[data-id="${song.id}"]`);
            if (currentCard) {
                currentCard.classList.add('playing');
                currentCard.style.borderLeftColor = "#ff4d94";
                currentCard.style.background = "rgba(255, 77, 148, 0.15)";
            }
        }
        
        // Cap nhat nut cuon tab
        function updateScrollButtons() {
            const tabsContainer = document.querySelector('.tabs');
            const scrollLeftBtn = document.getElementById('scrollLeftBtn');
            const scrollRightBtn = document.getElementById('scrollRightBtn');
            
            // Kiem tra xem co can hien thi nut cuon khong
            if (tabsContainer.scrollWidth > tabsContainer.clientWidth) {
                scrollLeftBtn.style.display = 'block';
                scrollRightBtn.style.display = 'block';
                
                scrollLeftBtn.addEventListener('click', () => {
                    tabsContainer.scrollBy({ left: -100, behavior: 'smooth' });
                });
                
                scrollRightBtn.addEventListener('click', () => {
                    tabsContainer.scrollBy({ left: 100, behavior: 'smooth' });
                });
            } else {
                scrollLeftBtn.style.display = 'none';
                scrollRightBtn.style.display = 'none';
            }
        }
        
        // Thiet lap su kien
        function setupEventListeners() {
            // Tim kiem
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', function() {
                searchTerm = this.value;
                renderContent(currentEmotion);
            });
            
            // Player controls
            document.getElementById('playBtn').addEventListener('click', function() {
                isPlaying = !isPlaying;
                this.innerHTML = isPlaying ? 
                    '<i class="fas fa-pause"></i>' : 
                    '<i class="fas fa-play"></i>';
                
                // Neu chua co bai hat nao duoc chon, chon bai dau tien
                if (!document.getElementById('playerTitle').textContent.includes("Chon mot bai hat")) {
                    return;
                }
                
                if (currentSongList.length > 0 && document.getElementById('playerTitle').textContent === "Chon mot bai hat de phat") {
                    playSong(currentSongList[0], 0);
                }
            });
            
            document.getElementById('prevBtn').addEventListener('click', function() {
                if (currentSongList.length === 0) return;
                
                currentSongIndex = (currentSongIndex - 1 + currentSongList.length) % currentSongList.length;
                playSong(currentSongList[currentSongIndex], currentSongIndex);
            });
            
            document.getElementById('nextBtn').addEventListener('click', function() {
                if (currentSongList.length === 0) return;
                
                currentSongIndex = (currentSongIndex + 1) % currentSongList.length;
                playSong(currentSongList[currentSongIndex], currentSongIndex);
            });
            
            // Tu dong chon bai hat dau tien khi nhan phat ma chua co bai nao
            document.getElementById('playBtn').addEventListener('click', function() {
                if (document.getElementById('playerTitle').textContent === "Chon mot bai hat de phat") {
                    if (currentSongList.length > 0) {
                        playSong(currentSongList[0], 0);
                    }
                }
            });
            
            // Cap nhat nut cuon khi thay doi kich thuoc cua so
            window.addEventListener('resize', updateScrollButtons);
        }
    </script>
