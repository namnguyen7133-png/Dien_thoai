<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Loc san pham Shopee Affiliate — De doc</title>

  <!-- Kieu chu va giao dien de doc, kich thuoc lon mac dinh -->
  <style>
    :root{
      --base-font: 20px;           /* mac dinh lon cho nguoi can */
      --scale-step: 2px;          /* buoc tang/giam chu */
      --container-max: 1100px;
      --accent: #1e88e5;
      --bg: #f7fbff;
      --card: #ffffff;
      --muted: #6b7280;
      --radius: 14px;
      --gap: 14px;
    }

    /* Reset nhe */
    *{box-sizing:border-box}
    html,body{height:100%; margin:0; padding:0; background:linear-gradient(180deg,var(--bg),#ffffff); font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; color:#0f1724}
    body{padding:20px; display:flex; align-items:flex-start; justify-content:center; gap:20px}

    /* Bo cuc */
    .container{
      width:100%;
      max-width:var(--container-max);
      background:var(--card);
      border-radius:var(--radius);
      box-shadow: 0 8px 30px rgba(16,24,40,0.08);
      padding:24px;
      overflow:hidden;
    }

    header{
      display:flex;
      gap:16px;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
    }

    .title {
      display:flex;
      gap:12px;
      align-items:center;
    }

    .logo {
      width:64px;
      height:64px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      background:linear-gradient(135deg,var(--accent),#6dd3ff);
      color:white;
      font-size:26px;
      flex-shrink:0;
      box-shadow: 0 6px 18px rgba(30,136,229,0.18);
    }

    h1{
      margin:0;
      font-size:calc(var(--base-font) * 1.6);
      line-height:1.05;
    }
    p.lead{margin:4px 0 0; color:var(--muted); font-size:calc(var(--base-font) * .9)}

    /* Controls form */
    .controls{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: var(--gap);
      margin-top:14px;
    }

    label{display:block; font-weight:600; font-size:calc(var(--base-font) * .95); margin-bottom:6px}
    input[type="file"]{padding:10px 12px}
    input[type="number"], input[type="text"], select {
      width:100%;
      padding:12px;
      font-size:var(--base-font);
      border-radius:10px;
      border:1px solid #e6eef8;
      background: #fbfeff;
      outline:none;
    }
    input[type="number"]::placeholder { color:#9aa4b2 }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:10px;
    }
    button {
      cursor:pointer;
      padding:12px 16px;
      font-size:calc(var(--base-font) * .95);
      border-radius:10px;
      border: none;
      box-shadow: 0 6px 18px rgba(2,6,23,0.06);
      transition:transform .12s ease, box-shadow .12s ease;
    }
    button:active { transform: translateY(1px) }
    .btn-primary{ background: var(--accent); color: #fff }
    .btn-ghost{ background: transparent; color: var(--accent); border:1px solid rgba(30,136,229,0.12) }
    .btn-secondary{ background:#eef6ff; color:var(--accent) }

    /* Controls nho: dieu chinh co chu */
    .zoom-controls{ display:flex; gap:8px; align-items:center; }
    .zoom-controls button{ padding:10px 12px; font-size:18px; border-radius:8px }

    /* Table responsive va de doc */
    .table-wrap{
      margin-top:18px;
      width:100%;
      overflow:auto;
      border-radius:10px;
      border:1px solid #eef3fb;
      background:linear-gradient(180deg,#ffffff, #fbfdff);
      padding:8px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:800px; /* cho man rong hien thi dep, small devices se scroll */
    }

    thead th{
      position:sticky;
      top:0;
      background:linear-gradient(180deg,#f0f7ff,#e9f2ff);
      color:#08304a;
      font-weight:700;
      padding:14px;
      text-align:left;
      font-size:calc(var(--base-font) * .95);
      border-bottom:2px solid #e6f0fb;
    }

    tbody td{
      padding:12px 14px;
      border-bottom:1px solid #f1f6fb;
      font-size:var(--base-font);
      vertical-align:top;
      white-space:normal;
      word-break:break-word; /* tranh tran chu */
    }

    tbody tr:hover{ background: linear-gradient(90deg, rgba(30,136,229,0.03), transparent) }

    /* Thong bao trang thai */
    .info{
      margin-top:12px;
      color:var(--muted);
      font-size:calc(var(--base-font) * .9);
    }

    /* Responsive nho: giam min-width table */
    @media (max-width:600px){
      :root{ --container-max: 100%; }
      .logo{ width:56px; height:56px; font-size:20px }
      table{ min-width:700px }
    }
  </style>
</head>
<body>
  <div class="container" role="main" aria-labelledby="main-title">
    <header>
      <div class="title">
        <div class="logo" aria-hidden="true">AF</div>
        <div>
          <h1 id="main-title">Loc san pham Affiliate — De doc</h1>
          <p class="lead">Kich thuoc chu lon, ro rang cho mat can — dieu chinh nhanh neu muon.</p>
        </div>
      </div>

      <div class="zoom-controls" aria-hidden="false" title="dieu chinh kich thuoc chu">
        <button type="button" id="decreaseBtn" class="btn-ghost" aria-label="Giam chu">A−</button>
        <button type="button" id="resetBtn" class="btn-secondary" aria-label="Reset chu">A</button>
        <button type="button" id="increaseBtn" class="btn-primary" aria-label="Tang chu">A+</button>
      </div>
    </header>

    <!-- Controls -->
    <div class="controls" aria-label="Bo loc san pham">
      <div>
        <label for="csvFile">Nhap file CSV san pham</label>
        <input type="file" id="csvFile" accept=".csv" aria-label="Chon file CSV san pham" />
      </div>

      <div>
        <label for="minPrice">Gia toi thieu (VNd)</label>
        <input type="number" id="minPrice" placeholder="50000" inputmode="numeric" />
      </div>

      <div>
        <label for="maxPrice">Gia toi da (VNd)</label>
        <input type="number" id="maxPrice" placeholder="200000" inputmode="numeric" />
      </div>

      <div>
        <label for="minCommission">Hoa hong toi thieu (%)</label>
        <input type="number" id="minCommission" placeholder="10" inputmode="numeric" />
      </div>

      <div>
        <label for="minSales">Luot ban toi thieu</label>
        <input type="number" id="minSales" placeholder="1000" inputmode="numeric" />
      </div>

      <div>
        <label for="previewLimit">So dong hien thi (tuy chon)</label>
        <input type="number" id="previewLimit" placeholder="0 = tat ca" inputmode="numeric" />
      </div>
    </div>

    <div class="actions" role="toolbar" aria-label="Hanh dong">
      <button class="btn-primary" onclick="filterCSV()" id="filterBtn">Loc san pham</button>
      <button class="btn-ghost" onclick="downloadCSV()" id="downloadBtn">Tai file CSV da loc</button>
      <button class="btn-secondary" onclick="clearTable()" id="clearBtn">Xoa ket qua</button>
    </div>

    <div id="status" class="info" role="status" aria-live="polite">Chua co du lieu</div>

    <div class="table-wrap" id="tableWrap" style="display:none;">
      <table id="resultTable" aria-describedby="status">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

<script>
  // Du lieu toan cuc
  let originalData = [];
  let filteredData = [];
  const root = document.documentElement;

  // Thiet lap co chu mac dinh (de doc cho nguoi can)
  function setBaseFont(sizePx){
    root.style.setProperty('--base-font', sizePx + 'px');
  }
  setBaseFont(20); // mac dinh 20px (co the tang)

  // Nut dieu chinh chu
  const incBtn = document.getElementById('increaseBtn');
  const decBtn = document.getElementById('decreaseBtn');
  const resetBtn = document.getElementById('resetBtn');
  incBtn.addEventListener('click', ()=> {
    const cur = parseFloat(getComputedStyle(root).getPropertyValue('--base-font'));
    setBaseFont(cur + parseFloat(getComputedStyle(root).getPropertyValue('--scale-step')));
  });
  decBtn.addEventListener('click', ()=> {
    const cur = parseFloat(getComputedStyle(root).getPropertyValue('--base-font'));
    if (cur > 12) setBaseFont(cur - parseFloat(getComputedStyle(root).getPropertyValue('--scale-step')));
  });
  resetBtn.addEventListener('click', ()=> setBaseFont(20));

  // Parse CSV don gian (van ho tro dong rong)
  function parseCSV(text){
    // chia theo dong, xu ly cac dong trong loai bo o cuoi
    const rows = text.split(/\r?\n/).filter(r => r.trim() !== '');
    // Phan tach don gian: neu can parse CSV phuc tap (quotes, dau phay trong o) co the thay bang thu vien
    return rows.map(row => {
      // neu co dau " bao quanh, xu ly co ban
      const values = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < row.length; i++){
        const ch = row[i];
        if (ch === '"' ) {
          inQuotes = !inQuotes;
          continue;
        }
        if (ch === ',' && !inQuotes) {
          values.push(cur);
          cur = '';
        } else {
          cur += ch;
        }
      }
      values.push(cur);
      return values.map(v => v.trim());
    });
  }

  function filterCSV(){
    const fileInput = document.getElementById('csvFile');
    if (!fileInput.files.length) {
      alert('Hay chon file CSV');
      return;
    }
    const previewLimit = Number(document.getElementById('previewLimit').value || 0);

    const reader = new FileReader();
    reader.onload = function(e){
      const csv = parseCSV(e.target.result);
      if (!csv.length) {
        alert('File CSV rong hoac khong doc duoc');
        return;
      }

      originalData = csv;
      const header = csv[0].map(h => h.toString().toLowerCase());
      const body = csv.slice(1);

      // Lay gia tri loc
      const minPrice = Number(document.getElementById('minPrice').value || 0);
      const maxPriceRaw = document.getElementById('maxPrice').value;
      const maxPrice = maxPriceRaw === '' ? Infinity : Number(maxPriceRaw);
      const minCommission = Number(document.getElementById('minCommission').value || 0);
      const minSales = Number(document.getElementById('minSales').value || 0);

      // Tim index truong theo ten pho bien; neu khong tim thi lay index mac dinh
      const idx = {
        price: header.indexOf('price') !== -1 ? header.indexOf('price') : header.indexOf('gia') !== -1 ? header.indexOf('gia') : header.indexOf('price_vn') !== -1 ? header.indexOf('price_vn') : -1,
        commission: header.indexOf('commission') !== -1 ? header.indexOf('commission') : header.indexOf('hoa hong') !== -1 ? header.indexOf('hoa hong') : header.indexOf('commission_rate') !== -1 ? header.indexOf('commission_rate') : -1,
        sales: header.indexOf('sales') !== -1 ? header.indexOf('sales') : header.indexOf('sold') !== -1 ? header.indexOf('sold') : header.indexOf('luot ban') !== -1 ? header.indexOf('luot ban') : -1
      };

      filteredData = body.filter(row => {
        // an toan: neu row ngan hon header, dien rong
        const safeRow = row.concat(Array(Math.max(0, header.length - row.length)).fill(''));
        const price = idx.price >=0 ? Number( safeRow[idx.price].replace(/[^\d.-]/g,'') || 0) : 0;
        const commission = idx.commission >=0 ? Number( safeRow[idx.commission].replace(/[^\d.-]/g,'') || 0) : 0;
        const sales = idx.sales >=0 ? Number( safeRow[idx.sales].replace(/[^\d.-]/g,'') || 0) : 0;

        return price >= minPrice && price <= maxPrice && commission >= minCommission && sales >= minSales;
      });

      // neu nguoi dung dat gioi han hien thi
      const rowsToShow = previewLimit > 0 ? filteredData.slice(0, previewLimit) : filteredData;

      renderTable(csv[0], rowsToShow);
      const status = document.getElementById('status');
      status.textContent = `Tim duoc ${filteredData.length} dong phu hop. Hien thi ${rowsToShow.length} dong.`;
    };
    reader.readAsText(fileInput.files[0], 'UTF-8');
  }

  function renderTable(header, rows){
    const table = document.getElementById('resultTable');
    const thead = document.getElementById('tableHead');
    const tbody = document.getElementById('tableBody');

    // Escape HTML an toan (tranh injection)
    const esc = s => String(s === undefined || s === null ? '' : s)
                   .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    thead.innerHTML = '<tr>' + header.map(h => `<th scope="col">${esc(h)}</th>`).join('') + '</tr>';
    tbody.innerHTML = rows.map(r => '<tr>' + r.map(c => `<td>${esc(c)}</td>`).join('') + '</tr>').join('');

    document.getElementById('tableWrap').style.display = rows.length ? 'block' : 'none';
  }

  function downloadCSV(){
    if (!filteredData.length) {
      alert('Chua co du lieu da loc');
      return;
    }
    const header = originalData[0];
    const csvContent = [header, ...filteredData].map(e => e.map(cell => {
      // neu cell chua dau phay hoac newline thi boc quote
      const cellStr = String(cell);
      if (cellStr.includes(',') || cellStr.includes('\n') || cellStr.includes('"')) {
        return '"' + cellStr.replace(/"/g,'""') + '"';
      }
      return cellStr;
    }).join(',')).join('\n');

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'san_pham_da_loc.csv';
    document.body.appendChild(link);
    link.click();
    link.remove();
  }

  function clearTable(){
    document.getElementById('tableHead').innerHTML = '';
    document.getElementById('tableBody').innerHTML = '';
    document.getElementById('tableWrap').style.display = 'none';
    document.getElementById('status').textContent = 'da xoa ket qua.';
    originalData = [];
    filteredData = [];
  }

  // Accessibility: ho tro phim tat tang/giam chu (T: tang, G: giam, R: reset)
  document.addEventListener('keydown', (e) => {
    if (e.key === 'T' || e.key === 't') incBtn.click();
    if (e.key === 'G' || e.key === 'g') decBtn.click();
    if (e.key === 'R' || e.key === 'r') resetBtn.click();
  });
</script>

<script>
window.onload = function() {
    setTimeout(() => {
        // Tu bam nut tinh toan
        const btn = document.querySelector('button') || document.querySelector('.btn-primary');
        if(btn) btn.click();
        
        setTimeout(() => {
            const text = document.body.innerText;
            const dacBiet = ["307", "14", "41", "27", "72", "627", "168"];
            let found = dacBiet.filter(s => text.includes("so " + s) || text.includes("Ket qua " + s));

            if (found.length > 0) {

};
</script>
</body>
</html>
