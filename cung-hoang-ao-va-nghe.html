<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Cung Hoang dao 2025 - Xem Tu Vi & Mon An Yeu Thich</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Orbitron:wght@500&family=Roboto:wght@300;400;500&display=swap');

  :root {
    --bg1: #0f0c29;
    --bg2: #302b63;
    --bg3: #24243e;
    --accent: #ff6bd6;
    --glow: 0 0 30px rgba(255,107,214,0.8);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: #fff;
    padding: 20px;
  }

  .container {
    max-width: 1000px;
    margin: 0 auto;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border-radius: 25px;
    padding: 40px 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.2);
  }

  h1 {
    font-family: 'Playfair Display', serif;
    text-align: center;
    font-size: 3.5rem;
    margin: 30px 0;
    background: linear-gradient(90deg, #ff6bd6, #4ecdc4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: var(--glow);
  }

  .today {
    text-align: center;
    font-size: 1.6rem;
    margin-bottom: 30px;
    padding: 20px;
    background: rgba(0,0,0,0.3);
    border-radius: 15px;
  }

  .input-area {
    text-align: center;
    margin: 40px 0;
  }

  input[type="date"] {
    padding: 15px 20px;
    font-size: 1.3rem;
    border: none;
    border-radius: 15px;
    background: rgba(255,255,255,0.9);
    color: #333;
  }

  button {
    padding: 15px 40px;
    font-size: 1.3rem;
    background: linear-gradient(45deg, #ff6bd6, #f368e0);
    border: none;
    border-radius: 15px;
    color: white;
    margin-left: 15px;
    cursor: pointer;
    box-shadow: var(--glow);
    transition: 0.4s;
  }

  button:hover { transform: scale(1.1); }

  .card {
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 30px;
    margin-top: 30px;
    box-shadow: var(--glow);
    animation: fadeIn 1s ease;
  }

  @keyframes fadeIn { from {opacity:0; transform:translateY(30px);} to {opacity:1; transform:none;} }

  .zodiac-big {
    font-size: 7rem;
    text-align: center;
    margin: 20px 0;
  }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 20px;
  }

  .box {
    background: rgba(255,255,255,0.1);
    padding: 20px;
    border-radius: 15px;
    backdrop-filter: blur(5px);
  }

  .good { color: #4ecdc4; }
  .bad { color: #ff6b6b; }
  .food { color: #ffd93d; font-weight: bold; }

  footer {
    text-align: center;
    margin-top: 60px;
    opacity: 0.8;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="container">
  <h1>CUNG HOANG dAO 2025</h1>

  <div class="today" id="today"></div>

  <div class="input-area">
    <input type="date" id="dateInput">
    <button onclick="xemCung()">XEM CUNG HOANG dAO</button>
  </div>

  <div class="card" id="result" style="display:none;">
    <div class="zodiac-big" id="icon"></div>
    <h2 style="text-align:center;" id="tenCung"></h2>

    <div class="info-grid>
      <div class="box">
        <strong>Thoi gian:</strong> <span id="thoiGian"></span>
      </div>
      <div class="box">
        <strong>Nghe nghiep phu hop:</strong> <span class="good" id="ngheTot"></span>
      </div>
      <div class="box">
        <strong>Nghe nen tranh:</strong> <span class="bad" id="ngheTranh"></span>
      </div>
      <div class="box">
        <strong>Mon an yeu thich:</strong> <span class="food" id="monAn"></span>
      </div>
    </div>
  </div>

  <footer>© 2025 Cung Hoang dao Viet Nam • Thiet ke dep lung linh</footer>
</div>

<script>

  { en: "Gemini",      vi: "Song Tu",      icon: "♊", start: "2025-05-21", end: "2025-06-20", ngheTot: "PR, dien vien, giao vien, moi gioi chung khoan, truyen thong, tong dai vien…", ngheTranh: "Cong viec on dinh cao, lap di lap lai", monAn: "Sinh to bo, banh mi kep thit/pate/trung" },
  { en: "Cancer",      vi: "Cu Giai",      icon: "♋", start: "2025-06-21", end: "2025-07-22", ngheTot: "Y ta, bac si, nhan su, giao vien, khach san – nha hang, lam vuon…", ngheTranh: "Cong viec thieu dong cam, giai tri, ca si", monAn: "Canh rong bien, salad rong nho, chao hai san nhe bung" },
  { en: "Leo",         vi: "Su Tu",        icon: "♌", start: "2025-07-23", end: "2025-08-22", ngheTot: "CEO, dien vien, huong dan vien du lich, thiet ke thoi trang, kien truc noi that", ngheTranh: "Cong viec khong duoc cong nhan, nghien cuu khoa hoc", monAn: "Pho khai vi, bo bit tet + ruou vang do" },
  { en: "Virgo",       vi: "Xu Nu",        icon: "♍", start: "2025-08-23", end: "2025-09-22", ngheTot: "Tro ly, duoc si, bien tap, nha khoa hoc, nha phe binh", ngheTranh: "Nghe tu do thieu to chuc, lanh dao giam doc", monAn: "Dau tay + banh kem, sushi tinh te" },
  { en: "Libra",       vi: "Thien Binh",   icon: "♎", start: "2025-09-23", end: "2025-10-22", ngheTot: "Luat su, ngoai giao, nghe thuat, thiet ke noi that, trang suc", ngheTranh: "Cong viec doc lap, tinh toan tien bac", monAn: "Ca hoi nuong bo toi, salad can bang hoan hao" },
  { en: "Scorpio",     vi: "Thien Yet",    icon: "♏", start: "2025-10-23", end: "2025-11-21", ngheTot: "Tham tu, luat su, nha khoa hoc, bac si", ngheTranh: "Phuc vu, boi ban, cong viec nho nhat", monAn: "Mi tron chua ngot cay, com ca ri An do dam da" },
  { en: "Sagittarius", vi: "Nhan Ma",      icon: "♐", start: "2025-11-22", end: "2025-12-21", ngheTot: "Huan luyen vien, huong dan vien du lich, dien vien hai, PR", ngheTranh: "Viec go bo it di chuyen, lap trinh vien", monAn: "Sashimi, mi Y cua sot pho mai trung muoi" },
  { en: "Capricorn",   vi: "Ma Ket",       icon: "♑", start: "2025-12-22", end: "2026-01-19", ngheTot: "Chinh tri gia, quan ly, freelancer, hoa si, nhac si, nha van", ngheTranh: "Luat su, kinh doanh rui ro cao", monAn: "Thit kho tau, xuc xich, que xien ca vien" },
  { en: "Aquarius",    vi: "Bao Binh",     icon: "♒", start: "2026-01-20", end: "2026-02-18", ngheTot: "Nha khoa hoc, phat minh, nhac si, quang cao sang tao", ngheTranh: "Moi gioi co phieu, kinh doanh bat dong san", monAn: "Kem lanh, salad bo sua chua mat lanh" },
  { en: "Pisces",      vi: "Song Ngu",     icon: "♓", start: "2026-02-19", end: "2026-03-20", ngheTot: "Nghe si, am nhac, nhiep anh, y ta, bac si thu y, nha tam ly hoc", ngheTranh: "Nha tham hiem, nhan vien van phong hanh chinh", monAn: "Banh trung thu dau xanh, banh Souffle phong xop mem" }
];

// Hien thi ngay hien tai
function showToday() {
  const now = new Date();
  const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  document.getElementById("today").innerHTML = 
    `<strong>Hom nay:</strong> ${now.toLocaleDateString('vi-VN', options)}<br>
     <strong>Cung hien tai: <strong>${getZodiac(now).vi}</strong> ${getZodiac(now).icon}`;
}
showToday();

// Tim cung theo ngay
function getZodiac(date) {
  const d = date.toISOString().split('T')[0]; // YYYY-MM-DD
  for (let z of zodiacData) {
    if (d >= z.start && d <= z.end) return z;
  }
  // Neu ngay ngoai khoang (vi du 20/3/2026 tro di) thi quay lai Aries
  return zodiacData[0];
}

// Khi bam nut Xem
function xemCung() {
  const input = document.getElementById("dateInput").value;
  if (!input) {
    alert("Vui long chon ngay sinh!");
    return;
  }

  const date = new Date(input);
  const zodiac = getZodiac(date);

  document.getElementById("icon").textContent = zodiac.icon;
  document.getElementById("tenCung").textContent = `${zodiac.vi} (${zodiac.en})`;
  document.getElementById("thoiGian").textContent = 
    `${new Date(zodiac.start).toLocaleDateString('vi-VN')} → ${new Date(zodiac.end).toLocaleDateString('vi-VN')}`;
  document.getElementById("ngheTot").textContent = zodiac.ngheTot;
  document.getElementById("ngheTranh").textContent = zodiac.ngheTranh;
  document.getElementById("monAn").textContent = zodiac.monAn;

  document.getElementById("result").style.display = "block";
  document.getElementById("result").scrollIntoView({ behavior: "smooth" });
}

// Tu dong dien ngay hom nay vao input
window.onload = () => {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById("dateInput").value = today;
  xemCung(); // hien thi luon cung hom nay
};
</script>

</script>
</body>
</html>
