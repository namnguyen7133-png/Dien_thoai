<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>BOT ĐĂNG BÀI - QUẢN LÝ LINK & XOAY VÒNG</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; display: flex; justify-content: center; padding-top: 20px; background-color: #f0f2f5; padding-bottom: 50px; }
        .box { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 600px; text-align: center; border-top: 10px solid #ee4d2d; }
        h2 { color: #ee4d2d; margin-bottom: 5px; text-transform: uppercase; }
        
        .status-bar { display: flex; justify-content: space-around; background: #fff5f2; padding: 12px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #ffdbd1; align-items: center; }
        .info-item { font-size: 14px; color: #555; }
        .info-item b { color: #ee4d2d; font-size: 18px; }

        .control-panel { background: #f8f9fa; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px dashed #ccc; text-align: left; }
        .input-group { display: flex; gap: 8px; margin-top: 8px; }
        
        input { padding: 8px; border-radius: 6px; border: 1px solid #ddd; outline: none; }
        input[type="number"] { width: 70px; text-align: center; font-weight: bold; }
        input[type="text"] { flex: 1; }

        .label { font-weight: bold; color: #333; margin-top: 15px; display: block; text-align: left; font-size: 14px; }
        #path-display, #link-display { color: #007bff; font-family: monospace; margin: 8px 0; font-size: 13px; background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px solid #ddd; word-break: break-all; text-align: left; }
        #link-name-active { color: #ee4d2d; font-weight: bold; margin-bottom: 5px; display: block; text-align: left; font-size: 15px;}
        #caption-display { border: 2px solid #ee4d2d; padding: 20px; border-radius: 12px; min-height: 50px; margin: 10px 0 20px 0; font-size: 16px; line-height: 1.6; background: #fff; text-align: left; color: #333; }

        /* Danh sách quản lý link */
        .link-manager { max-height: 150px; overflow-y: auto; background: #fff; border: 1px solid #eee; border-radius: 8px; margin-top: 10px; padding: 5px; }
        .link-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px; border-bottom: 1px solid #f9f9f9; font-size: 12px; }
        .btn-del { background: #ff4d4d; color: white; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 10px; }

        .btn-group { display: flex; flex-direction: column; gap: 8px; }
        button { padding: 10px; font-size: 14px; cursor: pointer; border-radius: 8px; border: none; transition: 0.2s; font-weight: bold; }
        
        .btn-update { background: #ee4d2d; color: white; }
        .btn-reset { background: #6c757d; color: white; }
        .btn-add { background: #28a745; color: white; width: 100%; margin-top: 5px; }

        .btn-step { text-align: left; position: relative; padding-left: 45px; height: 50px;}
        .btn-step::before { position: absolute; left: 15px; font-size: 18px; top: 12px;}
        .btn-step-1 { background: #1877f2; color: white; }
        .btn-step-1::before { content: "🔗"; }
        .btn-step-2 { background: #007bff; color: white; }
        .btn-step-2::before { content: "📁"; }
        .btn-step-3 { background: #555; color: white; }
        .btn-step-3::before { content: "✍️"; }

        button:hover { opacity: 0.9; transform: scale(1.01); }
        .small-title { font-size: 12px; font-weight: bold; color: #666; display: block; margin-top: 10px;}
    </style>
</head>
<body>

<div class="box">
    <h2>🤖 BOT ĐĂNG BÀI PRO</h2>
    
    <div class="status-bar">
        <div class="info-item">⏰ Ca hiện tại: <br><b id="current-ca">...</b></div>
        <div class="info-item">🖼️ Ảnh số: <br><b id="img-num">...</b></div>
    </div>

    <div class="control-panel">
        <span class="label" style="margin-top:0">⚙️ ĐIỀU CHỈNH SỐ ẢNH:</span>
        <div class="input-group">
            <input type="number" id="manual-index" min="1">
            <button class="btn-update" onclick="setManualIndex()" style="flex:1">CẬP NHẬT VỊ TRÍ</button>
            <button class="btn-reset" onclick="resetToAuto()">RESET</button>
        </div>
    </div>

    <div class="control-panel" style="border-color: #28a745;">
        <span class="label" style="margin-top:0">➕ QUẢN LÝ DANH SÁCH LINK:</span>
        <div class="input-group">
            <input type="text" id="new-link-name" placeholder="Tên gợi nhớ">
            <input type="text" id="new-link-url" placeholder="Dán link Facebook/Zalo...">
        </div>
        <button class="btn-add" onclick="addNewLink()">LƯU VÀO DANH SÁCH XOAY VÒNG</button>
        
        <span class="small-title">Danh sách hiện tại (Nhấn 🗑️ để xóa):</span>
        <div class="link-manager" id="link-list-ui">
            </div>
    </div>

    <div class="btn-group">
        <span class="label">🎯 Link đang áp dụng cho ảnh này:</span>
        <div id="link-name-active">...</div>
        <div id="link-display">...</div>
        <button class="btn-step btn-step-1" onclick="copyText('link-display', 'Link')">COPY LINK MXH</button>

        <span class="label">📍 Đường dẫn file ảnh:</span>
        <div id="path-display">D:\...</div>
        <button class="btn-step btn-step-2" onclick="copyText('path-display', 'Đường dẫn')">COPY ĐƯỜNG DẪN ẢNH</button>

        <span class="label">📝 Caption bài viết:</span>
        <div id="caption-display">...</div>
        <button class="btn-step btn-step-3" onclick="copyText('caption-display', 'Nội dung')">COPY CAPTION</button>
    </div>
</div>

<script>
    const pathFolder = "D:\\DA_CO_NOI_DUNG_FB_ZALO\\"; 
    
    const defaultLinks = [
        { name: "1. Mạ vàng", url: "https://www.facebook.com/profile.php?id=61584098697530" },
        { name: "2. Bảo vệ Asean", url: "https://www.facebook.com/profile.php?id=100070965590131" },
        { name: "3. Vệ sinh sau xây dựng", url: "https://www.facebook.com/profile.php?id=61556122846740" },
        { name: "4. Rèm cửa", url: "https://www.facebook.com/profile.php?id=61584711361332" },
        { name: "5. Du học", url: "https://www.facebook.com/profile.php?id=100070256732314" }
    ];

    const captions = [
        "Sau mỗi chuyến đi, mình lại càng trân trọng những phút giây thư giãn bên chiếc [...] tại nhà.",
        "Nhiều người hỏi mình bí kíp để có tấm hình lung linh? Thực ra tất cả nằm ở em [...] này nè.",
        "Check-in sang chảnh mà thiếu phụ kiện [...] thì coi như mất nửa cái 'vibe' rồi mọi người ơi.",
        "Đừng để những rắc rối nhỏ làm hỏng chuyến đi. Thủ sẵn [...] là yên tâm tuyệt đối."
    ];

    // Tải dữ liệu từ bộ nhớ
    let socialLinks = JSON.parse(localStorage.getItem('customSocialLinks')) || defaultLinks;

    function renderLinkList() {
        const container = document.getElementById('link-list-ui');
        container.innerHTML = socialLinks.map((item, index) => `
            <div class="link-item">
                <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:80%">
                    <b>${index + 1}.</b> ${item.name}
                </span>
                <button class="btn-del" onclick="deleteLink(${index})">🗑️ Xóa</button>
            </div>
        `).join('');
    }

    function runBot() {
        const now = new Date();
        const currentHour = now.getHours();
        
        let shiftName = currentHour < 12 ? "Sáng (6h-11h)" : (currentHour < 18 ? "Chiều (12h-17h)" : "Tối (18h-24h)");
        document.getElementById('current-ca').innerText = shiftName;

        let imgIndex;
        const savedIndex = localStorage.getItem('manualImgIndex');
        
        if (savedIndex) {
            imgIndex = parseInt(savedIndex);
        } else {
            const startDay = new Date(2026, 1, 26); 
            const diffInDays = Math.floor((now - startDay) / (1000 * 60 * 60 * 24));
            let shift = currentHour < 12 ? 0 : (currentHour < 18 ? 1 : 2);
            imgIndex = (diffInDays * 3) + shift + 1;
        }

        // Tránh lỗi nếu danh sách rỗng
        if (socialLinks.length > 0) {
            const linkIndex = (imgIndex - 1) % socialLinks.length;
            document.getElementById('link-name-active').innerText = socialLinks[linkIndex].name;
            document.getElementById('link-display').innerText = socialLinks[linkIndex].url;
        } else {
            document.getElementById('link-name-active').innerText = "Vui lòng thêm link!";
            document.getElementById('link-display').innerText = "";
        }

        const captionIndex = (imgIndex - 1) % captions.length;
        document.getElementById('img-num').innerText = imgIndex;
        document.getElementById('manual-index').value = imgIndex;
        document.getElementById('caption-display').innerText = captions[captionIndex];
        document.getElementById('path-display').innerText = pathFolder + "Ngay_" + imgIndex + ".jpg";
        
        renderLinkList();
    }

    function addNewLink() {
        const name = document.getElementById('new-link-name').value;
        const url = document.getElementById('new-link-url').value;
        if (name && url) {
            socialLinks.push({ name: name, url: url });
            saveAndRefresh();
            document.getElementById('new-link-name').value = '';
            document.getElementById('new-link-url').value = '';
        }
    }

    function deleteLink(index) {
        if (confirm("Bạn muốn xóa link: " + socialLinks[index].name + "?")) {
            socialLinks.splice(index, 1);
            saveAndRefresh();
        }
    }

    function saveAndRefresh() {
        localStorage.setItem('customSocialLinks', JSON.stringify(socialLinks));
        runBot();
    }

    function setManualIndex() {
        const val = document.getElementById('manual-index').value;
        if (val && val > 0) {
            localStorage.setItem('manualImgIndex', val);
            runBot();
        }
    }

    function resetToAuto() {
        localStorage.removeItem('manualImgIndex');
        runBot();
    }

    function copyText(elementId, label) {
        const text = document.getElementById(elementId).innerText;
        if (!text) return;
        const temp = document.createElement("textarea");
        document.body.appendChild(temp);
        temp.value = text;
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
        
        const btn = event.currentTarget;
        const oldText = btn.innerText;
        btn.innerText = "✅ ĐÃ COPY!";
        setTimeout(() => btn.innerText = oldText, 1000);
    }

    runBot();
</script>
</body>
</html>
