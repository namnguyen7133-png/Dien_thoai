<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trò Chơi Thực Dưỡng: Bổ Tạng Cân Bằng</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #eceff1; padding: 15px; margin: 0; }
        .game-app { max-width: 600px; margin: auto; background: white; border: 3px solid #2c3e50; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        
        /* Màn hình hiển thị chính */
        .river-screen { display: flex; gap: 10px; margin-bottom: 20px; background: #b3e5fc; padding: 15px; border-radius: 15px; border: 2px solid #0288d1; }
        .side { flex: 1; padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; min-height: 110px; display: flex; flex-direction: column; justify-content: center; box-shadow: inset 0 0 10px rgba(0,0,0,0.1); }
        .side-su { background: #fff; border: 2px solid #1976d2; color: #0d47a1; }
        .side-quy { background: #fff; border: 2px solid #d32f2f; color: #b71c1c; }
        
        /* Danh sách nút */
        .menu-container { background: #f5f5f5; border-radius: 15px; padding: 10px; border: 1px solid #ddd; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 400px; overflow-y: auto; padding-right: 5px; }
        
        button { padding: 12px; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; font-size: 0.85em; text-align: left; transition: 0.2s; background: white; line-height: 1.3; }
        button:hover { background: #e0e0e0; transform: translateY(-2px); }
        
        .sign { display: block; font-size: 1.2em; margin-bottom: 5px; }
        .price { color: #2e7d32; font-weight: bold; font-size: 0.8em; }

        .instruction { margin-top: 15px; font-size: 0.9em; background: #fff9c4; padding: 12px; border-radius: 10px; border-left: 6px solid #fbc02d; line-height: 1.5; }
        
        /* Scrollbar đẹp hơn */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #bdc3c7; border-radius: 10px; }
    </style>
</head>
<body>

<div class="game-app">
    <h2 style="text-align:center; margin-top:0; color:#2c3e50;">🚢 ĐÒ CÂN BẰNG: BỔ TẠNG</h2>
    
    <div class="river-screen">
        <div class="side side-su">
            <span id="role-su">NHÀ SƯ (+)</span>
            <div id="display-su" style="font-size: 0.9em; margin-top:8px;">Chưa chọn</div>
        </div>
        <div style="font-size: 1.5em; align-self:center;">☯</div>
        <div class="side side-quy">
            <span id="role-quy">QUỶ (-)</span>
            <div id="display-quy" style="font-size: 0.9em; margin-top:8px;">Chưa chọn</div>
        </div>
    </div>

    <div class="menu-container">
        <p style="font-size: 0.8em; font-weight:bold; margin: 0 0 10px 5px; color:#555;">CHỌN MÓN ĂN TẠI VIỆN / NHÀ:</p>
        <div id="menu-grid" class="grid">
            </div>
    </div>

    <div id="msg" class="instruction">
        <strong>Luật chơi:</strong> Bạn đang ở bệnh viện? Hãy chọn 1 món muốn ăn. Tôi sẽ báo đó là <b>Nhà sư (Dương)</b> hay <b>Quỷ (Âm)</b> và gợi ý món đối nghịch để chuyến đò cơ thể không bị chìm!
    </div>
</div>

<script>
// Danh sách món ăn từ dữ liệu bạn cung cấp
const foods = [
    {n: "Bao tử hầm tiêu (Dạ dày)", p: "75.000", s: "+", r: "Sư 1", t: "Khoai lang / Salad (Quỷ 1)"},
    {n: "Óc lợn hấp ngải cứu", p: "45.000", s: "++", r: "Sư 2", t: "Sữa chua / Trái cây (Quỷ 2)"},
    {n: "Trứng vịt lộn già", p: "25.000", s: "+++", r: "Sư 3", t: "Nước ép cần tây (Quỷ 3)"},
    {n: "Mắt cá ngừ / Mắt lợn", p: "35.000", s: "++", r: "Sư 2", t: "Táo tây / Salad (Quỷ 2)"},
    {n: "Pín bò hầm thuốc bắc", p: "120.000", s: "+++", r: "Sư 3", t: "Súp rau củ / Trà (Quỷ 3)"},
    {n: "Tràng lợn luộc (Nội tiết)", p: "80.000", s: "+", r: "Sư 1", t: "Rau mầm / Khoai (Quỷ 1)"},
    {n: "Đuôi bò hầm đỗ trọng", p: "95.000", s: "++", r: "Sư 2", t: "Chuối / Sữa chua (Quỷ 2)"},
    {n: "Tiết canh / Dồi (Máu)", p: "20.000", s: "+++", r: "Sư 3", t: "Nước ép rau củ (Quỷ 3)"},
    {n: "Bóng cá hầm (Da khớp)", p: "150.000", s: "++", r: "Sư 2", t: "Táo / Trái cây (Quỷ 2)"},
    {n: "Sách bò xào (Tỳ vị)", p: "60.000", s: "+", r: "Sư 1", t: "Salad rau mầm (Quỷ 1)"},
    {n: "Gan lợn / Patê", p: "30.000", s: "+", r: "Sư 1", t: "Ức gà / Salad (-)"},
    {n: "Cật lợn cháy tỏi (Thận)", p: "40.000", s: "++", r: "Sư 2", t: "Khoai lang / Sữa (--)"},
    {n: "Chân gà hầm (Khớp)", p: "35.000", s: "++", r: "Sư 2", t: "Trà thảo mộc / Táo (--)"},
    {n: "Móng giò hầm", p: "55.000", s: "++", r: "Sư 2", t: "Sữa hạt ngũ cốc (--)"},
    {n: "Sữa hạt ngũ cốc", p: "15.000", s: "--", r: "Quỷ 2", t: "Móng giò / Trứng (Sư 2)"},
    {n: "Trứng gà luộc", p: "5.000", s: "+", r: "Sư 1", t: "Khoai luộc / Táo (Quỷ 1)"},
    {n: "Táo tây", p: "10.000", s: "-", r: "Quỷ 1", t: "Trứng / Gan lợn (Sư 1)"},
    {n: "Hạnh nhân / Hạt điều", p: "12.000", s: "+", r: "Sư 1", t: "Sữa chua / Chuối (-)"},
    {n: "Sữa chua không đường", p: "8.000", s: "--", r: "Quỷ 2", t: "Óc lợn / Đuôi bò (Sư 2)"},
    {n: "Nước ép cần tây", p: "15.000", s: "---", r: "Quỷ 3", t: "Trứng vịt lộn / Pín bò (Sư 3)"},
    {n: "Ức gà áp chảo", p: "15.000", s: "+", r: "Sư 1", t: "Khoai lang / Rau (-)"},
    {n: "Khoai lang luộc", p: "5.000", s: "-", r: "Quỷ 1", t: "Ức gà / Cơm trắng (+)"},
    {n: "Salad rau mầm", p: "10.000", s: "-", r: "Quỷ 1", t: "Sách bò / Gan (+)"},
    {n: "Chuối chín", p: "3.000", s: "--", r: "Quỷ 2", t: "Đuôi bò / Chân gà (Sư 2)"},
    {n: "Cá hồi / Cá thu hấp", p: "25.000", s: "+", r: "Sư 1", t: "Súp rau củ (-)"},
    {n: "Súp rau củ", p: "12.000", s: "-", r: "Quỷ 1", t: "Cá hấp / Thịt luộc (+)"},
    {n: "Trà thảo mộc", p: "5.000", s: "--", r: "Quỷ 2", t: "Pín bò / Móng giò (Sư 2)"}
];

function loadMenu() {
    const grid = document.getElementById('menu-grid');
    grid.innerHTML = foods.map((item, idx) => `
        <button onclick="play(${idx})">
            <span class="sign">${item.s}</span>
            <b>${item.n}</b><br>
            <span class="price">${item.p}đ</span>
        </button>
    `).join('');
}

function play(idx) {
    const item = foods[idx];
    const isDuong = item.s.includes('+');
    
    const displaySu = document.getElementById('display-su');
    const displayQuy = document.getElementById('display-quy');
    const msg = document.getElementById('msg');

    if (isDuong) {
        displaySu.innerHTML = `<b style="color:#1565c0">${item.n}</b><br>(${item.r})`;
        displayQuy.innerHTML = `<span style="color:#999">Đang chờ...</span>`;
        msg.innerHTML = `🌟 <b>Lái đò bảo:</b> Bạn vừa đưa <b>${item.r}</b> lên thuyền để bổ tạng. Hãy tìm thêm <b>${item.t}</b> để cân bằng nhé!`;
    } else {
        displayQuy.innerHTML = `<b style="color:#c62828">${item.n}</b><br>(${item.r})`;
        displaySu.innerHTML = `<span style="color:#999">Đang chờ...</span>`;
        msg.innerHTML = `💀 <b>Lái đò báo:</b> <b>${item.r}</b> đã lên thuyền! Đừng để quỷ lấn lướt, hãy mời ngay <b>${item.t}</b> đi cùng cho ấm người!`;
    }
}

loadMenu();
</script>

</body>
</html>
