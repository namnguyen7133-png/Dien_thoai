<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ngũ Hành Luân Chuyển: Cân Bằng Gia Vị</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #e0e0e0; padding: 15px; line-height: 1.6; }
        .container { max-width: 650px; margin: auto; background: #1e1e1e; border: 2px solid #333; border-radius: 20px; padding: 20px; }
        h2 { text-align: center; color: #4caf50; margin-bottom: 25px; }
        
        .grid-select { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 25px; }
        .btn { padding: 15px 10px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.3s; text-align: center; font-size: 0.9em; }
        .btn:hover { transform: translateY(-3px); filter: brightness(1.2); }

        /* Màu hành */
        .btn-thuy { background: #2196f3; color: white; } /* Đêm/Lạnh */
        .btn-moc { background: #4caf50; color: white; } /* Sáng/Ấm */
        .btn-hoa { background: #f44336; color: white; } /* Trưa/Nóng */
        .btn-tho { background: #795548; color: white; } /* Chiều/Vừa */
        .btn-kim { background: #ffd700; color: #333; }  /* Tối/Mát */

        .result-panel { background: #2d2d2d; border-radius: 15px; padding: 20px; display: none; border: 1px solid #444; }
        .status-header { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        
        .solution-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { padding: 15px; border-radius: 10px; font-size: 0.9em; }
        .card-khac { background: #3e2723; border: 1px solid #f44336; }
        .card-sinh { background: #1b5e20; border: 1px solid #4caf50; }
        
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; }
        .tag-khac { background: #f44336; color: white; }
        .tag-sinh { background: #4caf50; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚢 CHUYẾN ĐÒ LUÂN CHUYỂN</h2>
    
    <div class="grid-select">
        <button class="btn btn-thuy" onclick="process('Thủy')">ĐÊM LẠNH<br>(Thủy)</button>
        <button class="btn btn-moc" onclick="process('Mộc')">SÁNG ẤM<br>(Mộc)</button>
        <button class="btn btn-hoa" onclick="process('Hỏa')">TRƯA NÓNG<br>(Hỏa)</button>
        <button class="btn btn-tho" onclick="process('Thổ')">CHIỀU VỪA<br>(Thổ)</button>
        <button class="btn btn-kim" onclick="process('Kim')">TỐI MÁT<br>(Kim)</button>
    </div>

    <div id="result" class="result-panel">
        <div id="status-text" class="status-header"></div>
        
        <div class="solution-grid">
            <div class="card card-khac">
                <span class="tag tag-khac">Đối Nghịch (Khắc)</span>
                <div id="khac-val"></div>
                <p style="font-size: 0.8em; margin-top:10px; color:#ffcdd2;">Dùng để chế ngự ngay trạng thái hiện tại.</p>
            </div>
            
            <div class="card card-sinh">
                <span class="tag tag-sinh">Chuyển Hóa (Sinh)</span>
                <div id="sinh-val"></div>
                <p style="font-size: 0.8em; margin-top:10px; color:#c8e6c9;">Dùng để nuôi dưỡng và làm ấm người từ bên trong.</p>
            </div>
        </div>
        
        <div id="special-note" style="margin-top:20px; font-size:0.85em; color:#bbb; border-top:1px solid #444; padding-top:10px;">
        </div>
    </div>
</div>

<script>
const logicMap = {
    'Thủy': {
        status: "Đêm lạnh, Da ướt, Người lạnh, Chảy mũi",
        khac: "ỚT, RƯỢU, ĐỒ NƯỚNG (HỎA)",
        sinh: "CHANH, DẤM, VỊ CHUA (MỘC)",
        note: "Khi đêm lạnh (Thủy), dùng Mộc (chua) để sinh Hỏa giúp cơ thể tự ấm lên."
    },
    'Mộc': {
        status: "Sáng ấm, Đầu tóc, Trĩ, Da ấm",
        khac: "CỦ CẢI, TIÊU, CAY (KIM)",
        sinh: "ĐƯỜNG, ĐỒ NGỌT (THỔ)",
        note: "Sáng ra Mộc vượng, dùng vị Ngọt (Thổ) để nuôi cơ bắp và ổn định vùng hạ bộ (trĩ)."
    },
    'Hỏa': {
        status: "Trưa nóng, Tim hồi hộp, Sốt nhiệt, Khó ngủ",
        khac: "MUỐI, MẶN, CHÁO (THỦY)",
        sinh: "TRÁI NGỌT, KHOAI (THỔ)",
        note: "Trưa nóng (Hỏa) cần Thủy để hạ nhiệt, dùng Thổ để giữ nước cho thịt da."
    },
    'Thổ': {
        status: "Chiều vừa, Người vàng, Da vừa, Tỳ vị",
        khac: "RAU XANH, DẤM (MỘC)",
        sinh: "GỪNG, CỦ CẢI, CAY (KIM)",
        note: "Chiều (Thổ) dùng vị Cay (Kim) để thông phổi, giúp da dẻ mát mẻ khi nắng xuống."
    },
    'Kim': {
        status: "Tối mát, Phổi khó thở, Da mát, Chân phải",
        khac: "GỪNG SẮC TRÀ, HỎA (ỚT)",
        sinh: "CHANH, DẤM, CHUA (MỘC)",
        note: "Tối mát (Kim) dùng vị Chua (Mộc) để tạo phản ứng nhiệt, làm ấm phổi và chân phải."
    }
};

function process(hanh) {
    const res = document.getElementById('result');
    const item = logicMap[hanh];
    
    res.style.display = 'block';
    document.getElementById('status-text').innerText = "Trạng thái: " + item.status;
    document.getElementById('status-text').style.color = getComputedStyle(document.querySelector('.btn-' + hanh.toLowerCase())).backgroundColor;
    
    document.getElementById('khac-val').innerHTML = "<b>Dùng:</b> " + item.khac;
    document.getElementById('sinh-val').innerHTML = "<b>Dùng:</b> " + item.sinh;
    document.getElementById('special-note').innerHTML = "💡 <b>Mẹo luân chuyển:</b> " + item.note;
}
</script>

</body>
</html>
