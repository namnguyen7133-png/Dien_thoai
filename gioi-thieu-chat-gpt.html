<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Tinh Huong & Bai Toan Cuoc Song</title>
<style>
  /* Tong the */
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(to right, #e0f7fa, #ffffff);
    margin: 0;
    padding: 20px;
  }
  h1 {
    text-align: center;
    color: #00796b;
    font-size: 2.5em;
    margin-bottom: 40px;
  }

  /* Accordion */
  .accordion {
    background-color: #ffffff;
    color: #004d40;
    cursor: pointer;
    padding: 20px;
    width: 100%;
    text-align: left;
    border: none;
    outline: none;
    transition: background-color 0.3s ease;
    margin-bottom: 10px;
    border-radius: 12px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    font-size: 1.2em;
  }
  .accordion:hover {
    background-color: #b2dfdb;
  }
  .accordion.active {
    background-color: #80cbc4;
    color: #ffffff;
  }

  /* Noi dung mo rong */
  .panel {
    padding: 0 20px;
    display: none;
    background-color: #e0f2f1;
    overflow: hidden;
    border-left: 5px solid #00796b;
    border-radius: 0 0 12px 12px;
    font-size: 1.1em;
    line-height: 1.6em;
  }
  .panel p {
    padding: 15px 0;
    margin: 0;
  }

  /* Responsive */
  @media (max-width: 768px) {
    h1 { font-size: 2em; }
    .accordion { font-size: 1em; padding: 15px; }
    .panel { font-size: 0.95em; padding: 0 15px; }
  }
</style>
</head>
<body>

// Tao cac muc accordion
const container = document.getElementById('accordion-container');
examples.forEach((item, index) => {
  const button = document.createElement('button');
  button.className = 'accordion';
  button.textContent = `Vi du #${index + 1}`;

  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<p>${item}</p>`;

  container.appendChild(button);
  container.appendChild(panel);
});

// Accordion mo/dong
const accordions = document.getElementsByClassName('accordion');
for (let i = 0; i < accordions.length; i++) {
  accordions[i].addEventListener('click', function() {
    this.classList.toggle('active');
    const panel = this.nextElementSibling;
    panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
  });
}

<script>

    setTimeout(() => {
        // Tu bam nut tinh toan
        const btn = document.querySelector('button') || document.querySelector('.btn-primary');
        if(btn) btn.click();
        
        setTimeout(() => {
            const text = document.body.innerText;
            const dacBiet = ["307", "14", "41", "27", "72", "627", "168"];
            let found = dacBiet.filter(s => text.includes("so " + s) || text.includes("Ket qua " + s));

            if (found.length > 0) {
                fetch('https://api.pushbullet.com/v2/pushes', {
                    method: 'POST',
                    headers: { 'Access-Token': 'o.dvjnPqSpLbPFkvPFAQEx9lvHjDQyhfJ2', 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'note',
                        title: '⚠ BAO dONG: ' + document.title,
                        body: 'Thay so: ' + found.join(", ")
                    })
                });
            }

    }, 2000);
};
</script>
