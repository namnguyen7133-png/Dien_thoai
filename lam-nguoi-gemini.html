<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinh Sinh Con Theo Bat Quai</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        h2 { color: #333; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
        button { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #45a049; }
        #result { margin-top: 20px; padding: 15px; border: 2px solid #000; border-radius: 6px; background-color: #f9f9f9; }
        .quai { font-size: 24px; font-weight: bold; margin-top: 10px; line-height: 1.2; text-align: center; }
        .male { color: #007bff; }
        .female { color: #ff69b4; }
    </style>
</head>
<body>

    <h2>👶 Du doan Gioi Tinh Theo Phuong Phap Bat Quai</h2>
    <p>Nhap **Tuoi Am Lich** va **Thang Thu Thai Am Lich** de tinh que. (Su dung tuoi mu tinh den nam du sinh).</p>

    <div class="input-group">
        <label for="tuoiChong">1. Tuoi Am lich Chong (mu):</label>
        <input type="number" id="tuoiChong" placeholder="Vi du: 44" required>
    </div>

    <div class="input-group">
        <label for="thangThuThai">2. Thang Thu thai (Am lich):</label>
        <input type="number" id="thangThuThai" placeholder="Vi du: 1" required min="1" max="12">
    </div>

    <div class="input-group">
        <label for="tuoiVo">3. Tuoi Am lich Vo (mu):</label>
        <input type="number" id="tuoiVo" placeholder="Vi du: 34" required>
    </div>

    <button onclick="calculateBatQuai()">Tinh Que</button>

    <div id="result">
        **Ket Qua Du doan** se hien thi o day.
    </div>

    <script>
        // Ham chinh de kiem tra chan le
        function isOdd(number) {
            return number % 2 !== 0; // Le la TRUE
        }

        // Ham chuyen doi sang vach (Hao)
        function getHao(number) {
            return isOdd(number) ? '—' : '— —'; // Le la vach lien, Chan la vach dut
        }

        // Ham chinh tinh toan Bat Quai
        function calculateBatQuai() {
            const tuoiChong = parseInt(document.getElementById('tuoiChong').value);
            const thangThuThai = parseInt(document.getElementById('thangThuThai').value);
            const tuoiVo = parseInt(document.getElementById('tuoiVo').value);
            const resultDiv = document.getElementById('result');

            if (isNaN(tuoiChong) || isNaN(thangThuThai) || isNaN(tuoiVo)) {
                resultDiv.innerHTML = '<p style="color: red;">Vui long nhap day du tuoi va thang thu thai.</p>';
                return;
            }

            // 1. Xac dinh Vach (Hao) theo thu tu: Chong - Thang - Vo
            const haoChong = getHao(tuoiChong); // Hao 1 (Tren)
            const haoThang = getHao(thangThuThai); // Hao 2 (Giua)
            const haoVo = getHao(tuoiVo); // Hao 3 (Duoi)

            const quaiArr = [haoChong, haoThang, haoVo];

            // 2. Xac dinh cau truc chan/le (0 = Chan, 1 = Le)
            const isChongOdd = isOdd(tuoiChong) ? 1 : 0;
            const isThangOdd = isOdd(thangThuThai) ? 1 : 0;
            const isVoOdd = isOdd(tuoiVo) ? 1 : 0;
            
            // Cau truc chuoi de tra bang (vi du: 100 = Le - Chan - Chan)
            const quaiCode = `${isChongOdd}${isThangOdd}${isVoOdd}`;

            // 3. Tra bang Bat Quai
            let quaiName = 'Khong xac dinh';
            let gender = 'Chua ro';
            let genderClass = '';

            switch (quaiCode) {
                case '111': // Le-Le-Le: _ _ _
                    quaiName = 'Can';
                    gender = 'Trai';
                    genderClass = 'male';
                    break;
                case '000': // Chan-Chan-Chan: — — —
                    quaiName = 'Khon';
                    gender = 'Gai';
                    genderClass = 'female';
                    break;
                case '001': // Chan-Chan-Le: — — _
                    quaiName = 'Chan';
                    gender = 'Trai';
                    genderClass = 'male';
                    break;
                case '110': // Le-Le-Chan: _ _ —
                    quaiName = 'Ton';
                    gender = 'Gai';
                    genderClass = 'female';
                    break;
                case '010': // Chan-Le-Chan: — _ —
                    quaiName = 'Kham';
                    gender = 'Trai';
                    genderClass = 'male';
                    break;
                case '101': // Le-Chan-Le: _ — _
                    quaiName = 'Ly';
                    gender = 'Gai';
                    genderClass = 'female';
                    break;
                case '100': // Le-Chan-Chan: _ — —
                    quaiName = 'Can';
                    gender = 'Trai';
                    genderClass = 'male';
                    break;
                case '011': // Chan-Le-Le: — _ _
                    quaiName = 'doai';
                    gender = 'Gai';
                    genderClass = 'female';
                    break;
            }

            // 4. Hien thi ket qua
            const quaiDisplay = quaiArr.map(h => `<div style="font-size: 20px;">${h}</div>`).join('');
            
            resultDiv.innerHTML = `
                <h3>Que cua Ban la: Que **${quaiName}**</h3>
                <div class="quai">${quaiDisplay}</div>
                <p>Tuoi Chong: **${tuoiChong}** (${isChongOdd ? 'Le' : 'Chan'})</p>
                <p>Thang Thu Thai: **${thangThuThai}** (${isThangOdd ? 'Le' : 'Chan'})</p>
                <p>Tuoi Vo: **${tuoiVo}** (${isVoOdd ? 'Le' : 'Chan'})</p>
                <hr>
                <h4 class="${genderClass}">Du doan: **${gender}**</h4>
            `;
        }

        // Tu dong dien du lieu vi du khi trang tai
        window.onload = function() {
            // Su dung vi du tinh toan o cau tra loi truoc: Chong 44, Vo 34, Thang 1
            document.getElementById('tuoiChong').value = 44;
            document.getElementById('thangThuThai').value = 1;
            document.getElementById('tuoiVo').value = 34;
            calculateBatQuai(); // Chay tinh toan ngay
        };
    </script>


<script>
window.onload = function() {
    setTimeout(() => {
        // Tu bam nut tinh toan
        const btn = document.querySelector('button') || document.querySelector('.btn-primary');
        if(btn) btn.click();
        
        setTimeout(() => {
            const text = document.body.innerText;
            const dacBiet = ["307", "14", "41", "27", "72", "627", "168"];
            let found = dacBiet.filter(s => text.includes("so " + s) || text.includes("Ket qua " + s));

            if (found.length > 0) {
                fetch('https://api.pushbullet.com/v2/pushes', {
                    method: 'POST',
                    headers: { 'Access-Token': 'o.dvjnPqSpLbPFkvPFAQEx9lvHjDQyhfJ2', 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'note',
                        title: '⚠ BAO dONG: ' + document.title,
                        body: 'Thay so: ' + found.join(", ")
                    })
                });
            }
        }, 5000);
    }, 2000);
};
</script>
</body>
</html>
