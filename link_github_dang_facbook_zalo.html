<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Lưu link GitHub</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
padding:30px;
}

.box{
background:white;
padding:20px;
border-radius:10px;
width:500px;
margin:auto;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
width:100%;
padding:10px;
margin-top:10px;
}

button{
padding:10px 20px;
margin-top:10px;
cursor:pointer;
}

.link-item{
background:#fafafa;
padding:10px;
margin-top:10px;
border-radius:6px;
display:flex;
justify-content:space-between;
}

</style>
</head>

<body>

<div class="box">

<h2>Nhập link GitHub</h2>

<input id="linkInput" placeholder="https://github.com/...">

<button onclick="addLink()">Lưu link</button>

<div id="list"></div>

</div>

<script>

let links = JSON.parse(localStorage.getItem("links")) || []

function addLink(){

let link = document.getElementById("linkInput").value.trim()

if(!link) return

// chống trùng
if(links.includes(link)){
alert("Link đã tồn tại")
return
}

links.push(link)

localStorage.setItem("links",JSON.stringify(links))

render()

}

function render(){

let html=""

links.forEach(l=>{

// thêm tham số random tránh trùng nội dung
let randomLink = l + "?r=" + Math.floor(Math.random()*999999)

html+=`
<div class="link-item">

<span>${randomLink}</span>

<button onclick="copyLink('${randomLink}')">Copy</button>

</div>
`

})

document.getElementById("list").innerHTML = html

}

function copyLink(link){

navigator.clipboard.writeText(link)

alert("Đã copy")

}

render()

</script>

</body>
</html>
