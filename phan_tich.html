<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Máy Tính Chiến Thuật Cashflow</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; padding: 20px; color: #2c3e50; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2980b9; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .section { margin-bottom: 30px; padding: 15px; border: 1px solid #e1e4e8; border-radius: 10px; }
        h2 { font-size: 1.2em; color: #2c3e50; margin-top: 0; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.9em; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 1em; }
        
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1em; }
        button:hover { background: #2980b9; }
        
        .result-box { margin-top: 15px; padding: 15px; border-radius: 5px; display: none; text-align: center; }
        .good { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .bad { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .formula { font-size: 0.8em; color: #7f8c8d; font-style: italic; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>CÔNG CỤ CHIẾN THUẬT CASHFLOW</h1>

    <div class="section">
        <h2>1. Phân Tích Cơ Hội Đầu Tư (ROI)</h2>
        <div class="formula">ROI = (Dòng tiền / Trả trước) x 100</div>
        
        <div class="input-group">
            <label>Dòng tiền hàng tháng ($):</label>
            <input type="number" id="cashflow" placeholder="VD: 900">
        </div>
        <div class="input-group">
            <label>Số tiền trả trước - Down Payment ($):</label>
            <input type="number" id="downpayment" placeholder="VD: 18000">
        </div>
        <button onclick="calcROI()">Phân tích Deal</button>
        
        <div id="roiResult" class="result-box"></div>
    </div>

    <div class="section">
        <h2>2. Mục Tiêu Tiền Mặt Tự Do Tài Chính (ACR)</h2>
        <div class="formula">ACR = Tổng chi phí / ROI mong muốn</div>
        
        <div class="input-group">
            <label>Tổng chi phí hàng tháng hiện tại ($):</label>
            <input type="number" id="totalExpense" placeholder="VD: 6000">
        </div>
        <div class="input-group">
            <label>Tỷ lệ ROI kỳ vọng (%):</label>
            <input type="number" id="expectedROI" placeholder="VD: 5" value="5">
        </div>
        <button onclick="calcACR()">Tính số tiền cần tích lũy</button>
        
        <div id="acrResult" class="result-box"></div>
    </div>
</div>

<script>
    function calcROI() {
        const cf = parseFloat(document.getElementById('cashflow').value);
        const dp = parseFloat(document.getElementById('downpayment').value);
        const resBox = document.getElementById('roiResult');
        
        if (dp > 0) {
            const roi = (cf / dp) * 100;
            resBox.style.display = 'block';
            let rank = "";
            
            // Phân loại theo tài liệu 
            if (roi >= 5) {
                resBox.className = 'result-box good';
                rank = "RẤT TỐT (Ưu tiên mua)";
            } else if (roi >= 4) {
                resBox.className = 'result-box good';
                rank = "TỐT (Nên đầu tư)";
            } else {
                resBox.className = 'result-box bad';
                rank = "TRUNG BÌNH (Cân nhắc kỹ)";
            }
            
            resBox.innerHTML = `ROI của bạn: <b>${roi.toFixed(1)}%</b><br>Đánh giá: ${rank}`;
        }
    }

    function calcACR() {
        const exp = parseFloat(document.getElementById('totalExpense').value);
        const roi = parseFloat(document.getElementById('expectedROI').value) / 100;
        const resBox = document.getElementById('acrResult');
        
        if (roi > 0) {
            const acr = exp / roi; // Công thức ACR [cite: 22, 25]
            resBox.style.display = 'block';
            resBox.className = 'result-box good';
            resBox.innerHTML = `Số tiền mặt bạn cần tích lũy:<br><b style="font-size: 1.4em;">$${acr.toLocaleString()}</b><br><small>Để đạt thu nhập thụ động $${exp.toLocaleString()} với ROI ${roi*100}%</small>`;
        }
    }
</script>

</body>
</html>
