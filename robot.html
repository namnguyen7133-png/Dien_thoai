<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Robot Thuc don Nam</title>

<style>
body{
  font-family:Arial, sans-serif;
  background:#f5f6f8;
  margin:0;
  padding:25px;
  font-size:22px;
  line-height:1.6;
}

h2{
  font-size:32px;
  margin-bottom:10px;
}

#trangThai{
  font-size:24px;
  font-weight:bold;
  margin:15px 0;
}

.menu{
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
  margin-top:15px;
}

.title{
  font-size:26px;
  font-weight:bold;
  margin-bottom:10px;
}
</style>
</head>

<body>

<h2>🍱 Robot thuc don nam</h2>
<div id="trangThai">dang kiem tra lich…</div>
<div id="menu"></div>

<script>

// ===== DANH SACH FILE =====

// AM LICH
const amFiles=[
"am-lich/tet1.html",
"am-lich/tet2.html",
"am-lich/tet3.html",
"am-lich/tet4.html",
"am-lich/tet5.html",
"am-lich/tet6.html",
"am-lich/tet7.html",
"am-lich/tet8.html",
"am-lich/tet9.html",
"am-lich/tet10.html",
"am-lich/tet11.html",
"am-lich/tet12.html",
"am-lich/ram-5.html",
"am-lich/mong1-5.html"
];

// NGU HANH TRI 17 NGAY
const leFiles=[
"le-duong/ngu-hanh-tri-17.html"
];

// AM LICH THUONG
const vietFiles=[
"am-lich/viet-thuong.html"
];

// IT BENH
const itFiles=[
"038%20Ch%E1%BA%BF%20%C4%91%E1%BB%99%20%C4%83n%20%C3%ADt%20b%E1%BB%87nh%20t%E1%BA%ADt%20.html"
];


// ===== dOC FILE =====
async function doc(url){
  try{
    const r=await fetch(url+"?t="+Date.now());
    if(!r.ok) return null;
    return await r.text();
  }catch(e){return null}
}

// ===== TRICH MON =====
function layMon(html){
  const lines=html.split("\n");
  let bat=false;
  let mon=[];

  for(const l of lines){
    const t=l.trim();
    const k=t.toLowerCase();

    if(k.includes("thuc don") || k.includes("mon") || k.includes("ngay")){
      bat=true;
      continue;
    }

    if(bat){
      if(t=="" || k.includes("tien")) break;
      mon.push(t.replace("-","").trim());
    }
  }
  return mon;
}

// ===== HIEN THI =====
function hien(mon,title){
  document.getElementById("menu").innerHTML=
    "<div class='menu'><div class='title'>"+title+"</div>"
    + mon.join("<br>") +
    "</div>";
}

// ===== KIEM TRA =====
async function checkGroup(files,title,status){
  for(const f of files){
    const html=await doc(f);
    if(!html) continue;

    const mon=layMon(html);
    if(mon.length){
      document.getElementById("trangThai").innerHTML=status;
      hien(mon,title);
      return true;
    }
  }
  return false;
}

// ===== ROBOT =====
async function robot(){

  // 1 AM LICH
  if(await checkGroup(amFiles,"Thuc don am lich","✔ Am lich")) return;

  // 2 NGU HANH TRI
  if(await checkGroup(leFiles,"Ngu hanh benh tri","✔ Ngu hanh tri")) return;

  // 3 AM LICH THUONG
  if(await checkGroup(vietFiles,"Mon Viet am lich","✔ Am lich thuong")) return;

  // 4 IT BENH
  if(await checkGroup(itFiles,"It benh tat","✔ It benh")) return;

  document.getElementById("trangThai").innerHTML="Khong co lich";
}

// chay
robot();
setInterval(robot,5000);

</script>

            if (found.length > 0) {

                    method: 'POST',

                    body: JSON.stringify({

};
</script>
</body>
</html>
