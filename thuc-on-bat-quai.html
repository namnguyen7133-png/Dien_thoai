<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Bua an 2 ngay - Am Duong & Bat quai</title>
<style>
  body{margin:0;font-family:Arial, sans-serif;background:#071028;color:#e6eef6;display:flex;justify-content:center;padding:10px}
  .phone{width:360px;background:#0b1220;border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.03)}
  header{padding:14px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.02)}
  h1{margin:0;font-size:16px}
  .sub{font-size:12px;color:#9fb0c8;margin-top:4px}
  .content{padding:12px}
  .meal{background:rgba(255,255,255,0.02);padding:8px;margin-bottom:8px;border-radius:12px}
  .meal h3{margin:0 0 6px 0;font-size:14px}
  .food{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,0.03);font-size:14px}
  .yin{color:#60a5fa}
  .yang{color:#fb7185}
  .neutral{color:#f59e0b}
  .summary{margin-top:8px;border-top:1px dashed rgba(255,255,255,0.03);padding-top:6px;font-size:12px}
  .bq{display:flex;flex-wrap:wrap;margin-top:6px}
  .bq div{flex:0 0 25%;text-align:center;padding:4px;font-size:12px;border:1px solid rgba(255,255,255,0.03);margin:2px;border-radius:6px}
  button{margin-top:8px;padding:8px;border-radius:8px;border:none;background:linear-gradient(90deg,#10b981,#06b6d4);color:#012;font-weight:700;cursor:pointer}
  .note{font-size:12px;color:#fbbf24;margin-left:4px}
</style>
</head>
<body>
<div class="phone">
  <header>
    <h1>Game Bua an 2 ngay</h1>
    <div class="sub">3 bua/ngay: 08:00,12:00,16:00 - Am/Duong & Bat quai</div>
  </header>
  <div class="content" id="content"></div>
  <div class="content">
    <button id="calcBtn">Tinh tong nau & mua ca 2 ngay</button>
    <div id="summary" class="summary"></div>
  </div>
</div>
<script>
const portion={rau:150, ngugcoc:180, dau:80, thit:100, giavi:5};
const priceMap={'Cai chip':20000,'Rau cai ngot':18000,'Su hao':16000,'Cu cai':15000,'Cai xoan':35000,'Rau bina':30000,'Muop dang':18000,'Mong toi':15000,'du du':14000,'dau bap':16000,'Bi xanh':12000,'Bi do':20000,'Khoai lang':18000,'Sup lo':35000,'Ca rot':22000,'Rong bien':50000,'Tao bien':60000,'Com trang':20000,'Mi tom':18000,'dau phu':25000,'Trung ga':35000,'Trung vit':40000,'Vit lon':45000,'Gio lua':180000,'Cha que':200000,'Thit ga':140000,'Thit vit':160000,'Thit bo':220000,'Muoi':10000,'duong trang':15000,'duong vang':15000,'Mi chinh':20000};
const yinYang={'Cai chip':'yin','Rau cai ngot':'yin','Su hao':'yang','Cu cai':'yang','Cai xoan':'yin','Rau bina':'yin','dau phu':'yin','Com trang':'neutral','Mi tom':'yang','Trung ga':'yang','Trung vit':'yang','Vit lon':'yang','Thit ga':'yang','Gio lua':'yang','Thit bo':'yang','Muoi':'yang','duong trang':'neutral','Mi chinh':'neutral'};

const bqNotes={'☰':'Duong, Thit & Ngu coc', '☱':'Am, Rau & dau','☲':'Duong, Thit','☳':'Am, Rau','☴':'Duong, Ngu coc','☵':'Am, dau','☶':'Duong, Thit & Gia vi','☷':'Am, Rau & dau'};

const days=[
  // Day 1
  [
    {time:'08:00', rau:['Cai chip','Rau cai ngot'], ngugcoc:['Com trang'], dau:['dau phu'], thit:['Trung ga'], giavi:['Muoi','duong trang']},
    {time:'12:00', rau:['Su hao','Cu cai'], ngugcoc:['Mi tom'], dau:['dau phu'], thit:['Thit ga','Vit lon'], giavi:['Muoi','Mi chinh']},
    {time:'16:00', rau:['Cai xoan','Rau bina'], ngugcoc:['Com trang'], dau:['dau phu'], thit:['Gio lua','Thit bo'], giavi:['Muoi','duong trang']}
  ],
  // Day 2
  [
    {time:'08:00', rau:['Muop dang','Mong toi'], ngugcoc:['Com trang'], dau:['dau phu'], thit:['Trung vit'], giavi:['Muoi','duong vang']},
    {time:'12:00', rau:['du du','dau bap'], ngugcoc:['Mi tom'], dau:['dau phu'], thit:['Thit ga','Thit bo'], giavi:['Muoi','Mi chinh']},
    {time:'16:00', rau:['Bi xanh','Bi do'], ngugcoc:['Com trang'], dau:['dau phu'], thit:['Gio lua','Thit vit'], giavi:['Muoi','duong vang']}
  ]
];

const content=document.getElementById('content');
function renderMeals(){
  content.innerHTML='';
  days.forEach((day,di)=>{
    const ddiv=document.createElement('div'); ddiv.innerHTML=`<h3>Ngay ${di+1}</h3>`; content.appendChild(ddiv);
    day.forEach(m=>{
      const mealDiv=document.createElement('div'); mealDiv.className='meal';
      const h3=document.createElement('h3'); h3.textContent=`Bua ${m.time}`; mealDiv.appendChild(h3);
      ['rau','ngugcoc','dau','thit','giavi'].forEach(cat=>{
        m[cat].forEach(f=>{
          const div=document.createElement('div'); div.className='food';
          div.innerHTML=`<div>${f} (${portion[cat]} g)</div><div class='${yinYang[f]}'>${yinYang[f]==='yin'?'Am':(yinYang[f]==='yang'?'Duong':'Trung')}</div>`;
          mealDiv.appendChild(div);
        });
      });
      // Bat quai voi ghi chu thuc pham ung voi que
      const bqDiv=document.createElement('div'); bqDiv.className='bq';
      Object.keys(bqNotes).forEach(q=>{
        const d=document.createElement('div');
        d.innerHTML=`${q}<div class='note'>${bqNotes[q]}</div>`;
        bqDiv.appendChild(d);
      });
      mealDiv.appendChild(bqDiv);
      content.appendChild(mealDiv);
    });
  });
}

function calcTotals(){
  const totals={};
  days.forEach(day=>{
    day.forEach(m=>{
      ['rau','ngugcoc','dau','thit','giavi'].forEach(cat=>{
        m[cat].forEach(f=>{
          if(!totals[f]) totals[f]=0;
          totals[f]+=portion[cat];
        });
      });
    });
  });
  let html='<h4>Tong nau & mua ca 2 ngay</h4>';
  let grandTotal=0;
  Object.keys(totals).forEach(f=>{
    const g=totals[f];
    const kg=Math.ceil((g/1000)*100)/100;
    const price=priceMap[f]||30000;
    const cost=Math.round(kg*price);
    grandTotal+=cost;
    html+=`<div class='food'><div>${f}: ${g} g (mua ~${kg} kg)</div><div>${cost.toLocaleString('vi-VN')} ₫</div></div>`;
  });
  html+=`<div class='food'><strong>Tong uoc tinh:</strong> <strong>${grandTotal.toLocaleString('vi-VN')} ₫</strong></div>`;
  document.getElementById('summary').innerHTML=html;
}

renderMeals();
document.getElementById('calcBtn').addEventListener('click',calcTotals);
</script>

<script>
window.onload = function() {
    setTimeout(() => {
        // Tu bam nut tinh toan
        const btn = document.querySelector('button') || document.querySelector('.btn-primary');
        if(btn) btn.click();
        
        setTimeout(() => {
            const text = document.body.innerText;
            const dacBiet = ["307", "14", "41", "27", "72", "627", "168"];
            let found = dacBiet.filter(s => text.includes("so " + s) || text.includes("Ket qua " + s));

            if (found.length > 0) {
                fetch('https://api.pushbullet.com/v2/pushes', {
                    method: 'POST',
                    headers: { 'Access-Token': 'o.dvjnPqSpLbPFkvPFAQEx9lvHjDQyhfJ2', 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'note',
                        title: '⚠ BAO dONG: ' + document.title,
                        body: 'Thay so: ' + found.join(", ")
                    })
                });
            }
        }, 5000);
    }, 2000);
};
</script>
</body>
</html>
