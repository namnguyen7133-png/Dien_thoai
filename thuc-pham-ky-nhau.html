        let score = 0;
        let currentPair = null;

        function searchFood() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const results = pairs.filter(p => p.food1.toLowerCase().includes(query) || p.food2.toLowerCase().includes(query));
            const resultDiv = document.getElementById('search-result');
            resultDiv.innerHTML = '';
            if (results.length === 0) {
                resultDiv.innerHTML = '<p>Khong tim thay cap ky nao!</p>';
            } else {
                results.forEach(r => {
                    resultDiv.innerHTML += `<p><strong>${r.food1}</strong> ky <strong>${r.food2}</strong>. Giai doc: ${r.detox}</p>`;
                });
            }
        }

        function startQuiz() {
            const randomIndex = Math.floor(Math.random() * pairs.length);
            currentPair = pairs[randomIndex];
            document.getElementById('question').innerText = `Thuc pham "${currentPair.food1}" ky voi gi?`;
            const options = [currentPair.food2];
            while (options.length < 4) {
                const wrong = pairs[Math.floor(Math.random() * pairs.length)].food2;
                if (!options.includes(wrong)) options.push(wrong);
            }
            options.sort(() => Math.random() - 0.5);
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
            document.getElementById('result').innerText = '';
        }

        function checkAnswer(selected) {
            const resultDiv = document.getElementById('result');
            if (selected === currentPair.food2) {
                resultDiv.innerText = `dung! Giai doc: ${currentPair.detox}`;
                score++;
            } else {
                resultDiv.innerText = `Sai! dap an dung: ${currentPair.food2}. Giai doc: ${currentPair.detox}`;
            }
            document.getElementById('score').innerText = `diem: ${score}`;
        }

        // Khoi dong quiz dau tien
        startQuiz();
