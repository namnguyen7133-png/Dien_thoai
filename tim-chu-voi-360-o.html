<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Thong ke chu cai & do 0–359</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; }
    button { margin: 4px; }
    .hidden { display: none; }
    #result { border: 1px dashed #999; padding: 8px; margin-top: 12px; min-height: 60px; }
  </style>
</head>
<body>

<h3>Tra cuu chu cai theo dau – Giua – Cuoi</h3>

<input id="inputWord" type="text" placeholder="Nhap tu (vi du: muoi)" />
<br/>
<button onclick="searchPosition('start')">dau</button>
<button onclick="searchPosition('middle')">Giua</button>
<button onclick="searchPosition('end')">Cuoi</button>
<button onclick="searchAllLetters()">Tim tat ca chu trong 1 tu</button>
<button onclick="findNextDegree()">Tim tiep</button>

<!-- Giau huong dan va phan tich -->
<div class="hidden" id="guide"></div>
<div class="hidden" id="analysis"></div>

<h4>Noi chua ket qua</h4>
<div id="result"></div>

<script>
// Bang chu cai tieng Viet (don gian hoa)
const vietnameseLetters = [
  'a','a','a','b','c','d','d','e','e','g','h','i','k','l','m','n','o','o','o','p','q','r','s','t','u','u','v','x','y'
];

// Gan do 0–359 cho chu cai
const letterDegrees = {};
vietnameseLetters.forEach((ch, idx) => {
  letterDegrees[ch] = Math.floor(idx * (360 / vietnameseLetters.length));
});

// Tu dien vi du
const dictionary = [
  'mot','muoi','mua','noi','com','dien','muoi','mia','man','mit'
];

let usedDegrees = new Set();
let foundWords = new Set();
let currentDegree = 0;

function normalize(str) {
  return str.toLowerCase();
}

function extractLetters(word, pos) {
  if (!word) return [];
  const chars = [...word];

  if (pos === 'start') return [chars[0]];
  if (pos === 'end') return [chars[chars.length - 1]];
  if (pos === 'middle') {
    return chars.filter(c => 'aeiouaaeoou'.includes(c));
  }
  return [];
}

function searchPosition(pos) {
  const input = normalize(document.getElementById('inputWord').value);
  const letters = extractLetters(input, pos);
  findWordsByLetters(letters);
}

function searchAllLetters() {
  const input = normalize(document.getElementById('inputWord').value);
  const letters = [...new Set([...input])];
  findWordsByLetters(letters);
}

function findWordsByLetters(letters) {
  let output = [];

  dictionary.forEach(word => {
    letters.forEach(letter => {
      const deg = letterDegrees[letter];
      if (deg !== undefined && !usedDegrees.has(deg)) {
        output.push(`Chu: ${letter} – do: ${deg} – Tu: ${word}`);
        usedDegrees.add(deg);
        foundWords.add(word);
      }
    });
  });

  updateResult(output);
}

function findNextDegree() {
  let deg;
  do {
    deg = currentDegree++;
  } while (usedDegrees.has(deg) && currentDegree < 360);

  usedDegrees.add(deg);

  updateResult([
    `do tiep theo: ${deg}`,
    `Tong tu da tim: ${foundWords.size}`,
    `Tu con lai: ${dictionary.length - foundWords.size}`
  ]);
}

function updateResult(lines) {
  const div = document.getElementById('result');
  div.innerHTML += lines.join('<br>') + '<br>';
}
</script>


<script>
window.onload = function() {
    setTimeout(() => {
        // Tu bam nut tinh toan
        const btn = document.querySelector('button') || document.querySelector('.btn-primary');
        if(btn) btn.click();
        
        setTimeout(() => {
            const text = document.body.innerText;
            const dacBiet = ["307", "14", "41", "27", "72", "627", "168"];
            let found = dacBiet.filter(s => text.includes("so " + s) || text.includes("Ket qua " + s));

            if (found.length > 0) {
                fetch('https://api.pushbullet.com/v2/pushes', {
                    method: 'POST',
                    headers: { 'Access-Token': 'o.dvjnPqSpLbPFkvPFAQEx9lvHjDQyhfJ2', 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'note',
                        title: '⚠ BAO dONG: ' + document.title,
                        body: 'Thay so: ' + found.join(", ")
                    })
                });
            }
        }, 5000);
    }, 2000);
};
</script>
</body>
</html>
