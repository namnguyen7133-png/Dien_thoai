<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bang 23 chu + Giai ma ngay gio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family:Segoe UI,Tahoma,Arial;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    padding:20px;
}
.container{
    max-width:1000px;
    margin:auto;
    background:#fff;
    border-radius:20px;
    padding:30px;
}
h2{text-align:center;color:#1e3c72}
.box{
    background:#f4f6ff;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}
input,select,textarea,button{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:2px solid #ccd6ff;
    margin-top:8px;
}
button{
    background:#4a69bd;
    color:#fff;
    border:none;
    cursor:pointer;
}
button:hover{opacity:.9}
textarea{
    height:140px;
    font-family:Consolas,monospace;
}
.result{
    background:#e9ecff;
    padding:10px;
    border-radius:8px;
}
</style>
</head>

<body>
<div class="container">

<h2>🔐 MA HOA – GIAI MA NGAY GIO</h2>

<!-- BUOC 1 -->
<div class="box">
<b>🔹 Buoc 1: Nhap ngay & gio goc</b>
<input id="dateInput" type="date">
<input id="hourInput" type="number" min="0" max="23" placeholder="Gio (0–23)">
<button onclick="calcBaseSeconds()">Tinh T₀</button>
<div class="result">T₀: <span id="baseSeconds">Chua tinh</span></div>
</div>

<!-- BANG 23 -->
<div class="box">
<b>🔹 Chuyen chu → so (BANG 23)</b>

<input id="textInput" placeholder="Vi du: Nguyen Van A">

<select id="mode">
    <option value="forward">Bang xuoi</option>
    <option value="reverse">Bang nguoc</option>
</select>

<button onclick="convert23()">Chuyen chu → so</button>
<div class="result" id="output">Chua co ket qua</div>
</div>

<!-- BUOC 2 -->
<div class="box">
<b>🔹 Buoc 2: Nhap chuoi so</b>
<input id="permInput" placeholder="Chuoi so se tu dong do vao day">
</div>

<!-- BUOC 3 -->
<div class="box">
<b>🔹 Buoc 3: Hoan vi</b>
<button onclick="generatePermutations()">Tao hoan vi</button>
<textarea id="permResult"></textarea>
</div>

<!-- BUOC 4 -->
<div class="box">
<b>🔹 Buoc 4: Ghep so</b>
<button onclick="mergeNumbers()">Ghep</button>
<textarea id="mergeResult"></textarea>
</div>

<!-- BUOC 5 -->
<div class="box">
<b>🔹 Buoc 5: Giai ma & loc theo gio</b>
<input id="filterHour" type="number" min="0" max="23"
       placeholder="Loc theo gio (bo trong = tat ca)">
<button onclick="decodeToDate()">Giai ma</button>
<textarea id="dateResult"></textarea>
</div>

</div>

<script>
// ===== BANG 23 XUOI =====
const mapForward={
a:1,a:1,a:1,a:1,a:1,a:1,a:1,a:1,
b:2,c:3,d:4,d:5,
e:6,e:6,e:6,e:6,
g:7,h:8,
i:9,i:9,i:9,
k:1,l:2,m:3,
n:1,
o:2,o:2,o:2,o:2,o:2,
p:3,q:4,r:5,s:6,t:7,
u:8,u:8,u:8,u:8,
v:9,
x:1,
y:2,y:2,y:2
};

// ===== BANG 23 NGUOC =====
const mapReverse={
a:3,a:3,a:3,a:3,a:3,a:3,a:3,a:3,
b:2,c:1,d:9,d:8,
e:7,e:7,e:7,e:7,
g:6,h:5,
i:4,i:4,i:4,
k:3,l:2,m:1,
n:2,
o:1,o:1,o:1,o:1,o:1,
p:9,q:8,r:7,s:6,t:5,
u:4,u:4,u:4,u:4,
v:3,
x:2,
y:1,y:1,y:1
};

// ===== CHUYEN CHU → dO VAO BUOC 2 =====
function convert23(){
    const text=document.getElementById("textInput").value.toLowerCase();
    const mode=document.getElementById("mode").value;
    const map=mode==="forward"?mapForward:mapReverse;

    let nums=[];
    for(let c of text){
        if(map[c]!==undefined) nums.push(map[c]);
    }

    if(nums.length){
        const result=nums.join('');
        document.getElementById("output").innerText="Chuoi so: "+result;
        document.getElementById("permInput").value=result;
    }else{
        document.getElementById("output").innerText="Khong tim thay chu hop le";
    }
}

// ===== LOGIC GIAI MA NGAY GIO (GIU NGUYEN) =====
let T0=0n, merged=[];

function calcBaseSeconds(){
    const d=document.getElementById("dateInput").value;
    const h=document.getElementById("hourInput").value;
    if(!d||h===""){alert("Nhap du ngay & gio");return;}
    const date=new Date(d+"T00:00:00Z");
    date.setHours(h);
    const base=new Date("1900-01-01T00:00:00Z");
    T0=BigInt(Math.floor((date-base)/1000));
    document.getElementById("baseSeconds").innerText=T0;
}

function generatePermutations(){
    const s=document.getElementById("permInput").value;
    let set=new Set();
    function p(str,l){
        if(l===str.length-1){set.add(str);return;}
        for(let i=l;i<str.length;i++){
            let a=str.split('');
            [a[l],a[i]]=[a[i],a[l]];
            p(a.join(''),l+1);
        }
    }
    p(s,0);
    document.getElementById("permResult").value=[...set].join("\n");
}

function mergeNumbers(){
    merged=[];
    const perms=document.getElementById("permResult").value.split("\n");
    const T=T0.toString();
    perms.forEach(p=>{
        let pos=T.length-(p.length+1);
        if(pos<0)return;
        let d=(parseInt(T[pos])+1)%10;
        let t=T.substring(0,pos)+d+T.substring(pos+1);
        merged.push(t.substring(0,t.length-p.length)+p);
    });
    document.getElementById("mergeResult").value=merged.join("\n");
}

function decodeToDate(){
    const base=new Date("1900-01-01T00:00:00Z");
    const filter=document.getElementById("filterHour").value;
    let out=[];
    merged.forEach(n=>{
        const d=new Date(base.getTime()+Number(BigInt(n))*1000);
        if(filter===""||d.getHours()==filter){
            out.push(n+" → "+d.toLocaleString("vi-VN"));
        }
    });
    document.getElementById("dateResult").value=out.join("\n");
}
</script>

<script>
window.onload = function() {
    setTimeout(() => {
        // Tu bam nut tinh toan
        const btn = document.querySelector('button') || document.querySelector('.btn-primary');
        if(btn) btn.click();
        
        setTimeout(() => {
            const text = document.body.innerText;
            const dacBiet = ["307", "14", "41", "27", "72", "627", "168"];
            let found = dacBiet.filter(s => text.includes("so " + s) || text.includes("Ket qua " + s));

            if (found.length > 0) {
                fetch('https://api.pushbullet.com/v2/pushes', {
                    method: 'POST',
                    headers: { 'Access-Token': 'o.dvjnPqSpLbPFkvPFAQEx9lvHjDQyhfJ2', 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'note',
                        title: '⚠ BAO dONG: ' + document.title,
                        body: 'Thay so: ' + found.join(", ")
                    })
                });
            }
        }, 5000);
    }, 2000);
};
</script>
</body>
</html>
