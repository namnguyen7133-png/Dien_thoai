<!DOCTYPE html>
<html>
<head>
    <title>Tim Kiem Phuong Tien & do Dung Cong So</title>
    <meta charset="UTF-8">
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 20px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            min-height: 100vh; 
        }
        .container { 
            background: white; 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-width: 1100px; 
            margin: 0 auto; 
        }
        h2 { 
            color: #2c3e50; 
            text-align: center; 
            margin-bottom: 20px; 
            padding-bottom: 15px; 
            border-bottom: 2px solid #3498db; 
        }
        
        .stats-bar {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid #1976d2;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9em;
            padding: 3px 0;
        }
        .stat-value {
            font-weight: bold;
            color: #1976d2;
            font-size: 1em;
            background: white;
            padding: 2px 8px;
            border-radius: 12px;
            min-width: 35px;
            text-align: center;
        }
        
        .category-filter {
            margin-bottom: 15px;
        }
        .category-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .category-button {
            padding: 8px 16px;
            font-size: 13px;
            border: 2px solid #95a5a6;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            color: #2c3e50;
        }
        .category-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        .category-button.active {
            background: #3498db;
            color: white;
            border-color: #2980b9;
        }
        
        .input-section { 
            margin-bottom: 20px; 
        }
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            font-size: 16px; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            box-sizing: border-box;
            transition: all 0.3s;
            margin-bottom: 12px;
        }
        input[type="text"]:focus { 
            border-color: #3498db; 
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }
        
        .mode-buttons { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .mode-button { 
            padding: 10px 20px; 
            font-size: 14px; 
            border: 2px solid #3498db; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.3s; 
            flex: 1;
            background: white;
            color: #3498db;
            font-weight: bold;
            min-width: 110px;
        }
        .mode-button:hover { 
            background: #f0f8ff;
            transform: translateY(-2px);
        }
        .mode-button.active { 
            background: #3498db; 
            color: white; 
            border-color: #2980b9;
            box-shadow: 0 3px 6px rgba(52, 152, 219, 0.2);
        }
        
        .special-button {
            background: #9b59b6;
            color: white;
            border: 2px solid #8e44ad;
        }
        .special-button:hover {
            background: #8e44ad;
        }
        .special-button.active {
            background: #8e44ad;
            border-color: #7d3c98;
        }
        
        .button-group { 
            display: flex; 
            gap: 12px; 
            margin-top: 8px; 
            flex-wrap: wrap;
        }
        button { 
            padding: 12px 24px; 
            font-size: 14px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.3s; 
            flex: 1;
            min-width: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        #searchBtn { 
            background: linear-gradient(135deg, #2ecc71, #27ae60); 
            color: white; 
        }
        #searchBtn:hover { 
            background: linear-gradient(135deg, #27ae60, #219653);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.2);
        }
        #nextBtn { 
            background: linear-gradient(135deg, #3498db, #2980b9); 
            color: white; 
        }
        #nextBtn:hover { 
            background: linear-gradient(135deg, #2980b9, #1c6ea4);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.2);
        }
        #nextBtn:disabled { 
            background: #bdc3c7; 
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .char-sequence-container {
            margin: 15px 0;
            padding: 12px;
            background: white;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            display: none;
        }
        .char-sequence-title {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 0.95em;
        }
        .char-sequence {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: flex-start;
            align-items: center;
            max-width: 100%;
            overflow: visible;
        }
        .char-box { 
            width: 35px; 
            height: 35px; 
            background: #ecf0f1; 
            border-radius: 6px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            font-size: 1.1em;
            color: #2c3e50;
            border: 2px solid #bdc3c7;
            transition: all 0.3s;
            position: relative;
        }
        .char-box.found { 
            background: #2ecc71; 
            color: white; 
            border-color: #27ae60;
        }
        .char-box.not-found { 
            background: #e74c3c; 
            color: white; 
            border-color: #c0392b;
        }
        .char-box.special-found {
            background: #9b59b6;
            color: white;
            border-color: #8e44ad;
        }
        .char-index {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #2c3e50;
            color: white;
            font-size: 0.5em;
            padding: 1px 3px;
            border-radius: 6px;
            min-width: 14px;
            text-align: center;
        }
        
        .result-section { 
            margin-top: 15px; 
        }
        .result-box { 
            background: white; 
            padding: 15px; 
            border-radius: 8px; 
            min-height: 100px; 
            border: 2px solid #e0e0e0; 
            margin-top: 8px;
        }
        .status-info { 
            margin-top: 12px; 
            padding: 10px; 
            background: linear-gradient(135deg, #f8f9fa, #e9ecef); 
            border-radius: 8px; 
            color: #2c3e50;
            border-left: 4px solid #3498db;
            font-size: 0.85em;
        }
        
        .found-item { 
            background: linear-gradient(135deg, #ffffff, #f8f9fa); 
            padding: 12px; 
            margin: 8px 0; 
            border-radius: 6px; 
            border-left: 4px solid #2ecc71; 
            display: flex; 
            align-items: center;
            box-shadow: 0 1px 5px rgba(0,0,0,0.05);
        }
        .found-item.not-found {
            border-left-color: #e74c3c;
            background: linear-gradient(135deg, #fff5f5, #ffeaea);
        }
        .found-item.special {
            border-left-color: #9b59b6;
            background: linear-gradient(135deg, #f5eef8, #e8daef);
        }
        .found-item .char-match { 
            background: #3498db; 
            color: white; 
            width: 30px; 
            height: 30px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            font-size: 1em;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .found-item.not-found .char-match {
            background: #e74c3c;
        }
        .found-item.special .char-match {
            background: #9b59b6;
        }
        .found-item .item-info { 
            flex: 1; 
        }
        .found-item .item-name { 
            font-weight: bold; 
            font-size: 1em; 
            color: #2c3e50;
            margin-bottom: 2px;
        }
        .found-item .item-location { 
            color: #7f8c8d; 
            font-size: 0.85em;
        }
        .found-item .item-description {
            color: #7f8c8d;
            font-size: 0.8em;
            font-style: italic;
            margin-top: 3px;
        }
        
        .summary-box {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            border-left: 4px solid #4caf50;
            font-size: 0.85em;
        }
        
        .special-summary {
            background: linear-gradient(135deg, #f5eef8, #e8daef);
            border-left: 4px solid #9b59b6;
        }
        
        .search-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.8em;
            color: #7f8c8d;
        }
        
        @media (max-width: 768px) {
            .container { padding: 15px; }
            .char-box { width: 30px; height: 30px; font-size: 0.95em; }
            button { min-width: 100%; }
            .button-group, .mode-buttons, .category-buttons { flex-direction: column; }
            .char-sequence { gap: 5px; }
            .mode-button, .category-button { min-width: 100%; }
            .stats-bar { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Thong ke -->

            </div>
            <div class="stat-item">

                <span class="stat-value" id="officeItems">0</span>
            </div>
            <div class="stat-item">

                <span class="stat-value" id="personalVehicleItems">0</span>
            </div>
            <div class="stat-item">

            </div>
        </div>
        
        <!-- Bo loc danh muc -->

            <div class="category-buttons">
                <button class="category-button active" data-category="all" onclick="setCategory('all')">
                    Tat ca
                </button>
                <button class="category-button" data-category="vehicle" onclick="setCategory('vehicle')">
                    🚗 Phuong tien
                </button>
                <button class="category-button" data-category="office" onclick="setCategory('office')">
                    🏢 Cong so
                </button>
                <button class="category-button" data-category="personal_vehicle" onclick="setCategory('personal_vehicle')">
                    🚲 Xe ca nhan
                </button>
                <button class="category-button" data-category="office_supply" onclick="setCategory('office_supply')">
                    📐 Van phong
                </button>
            </div>
        </div>
        
        <div class="input-section">

            <div class="mode-buttons">

                <button class="mode-button" data-mode="middle" onclick="setMode('middle')">
                    GIUA

                <button class="mode-button" data-mode="last" onclick="setMode('last')">

                <button class="mode-button special-button" data-mode="all_chars" onclick="setMode('all_chars')">
                    TIM TAT CA
                </button>
            </div>
        </div>
        
        <div class="button-group">
            <button id="searchBtn" onclick="searchItems()">

            <button id="nextBtn" onclick="nextSearch()" disabled>
                <span>⏭</span> Tim tiep

        </div>
        
        <div class="char-sequence-container" id="charSequenceContainer">

            <div class="char-sequence" id="charSequenceDisplay"></div>
        </div>
        
        <div class="result-section">

                Chon che do: dAU (chu dau), GIUA (chu giua), CUOI (chu cuoi), TIM TAT CA (tim cac chu trong 1 tu)
            </div>
        </div>
    </div>

        function getItemKey(item, mode) {
            switch(mode) {
                case 'first': return item.key_first;
                case 'middle': return item.key_middle;
                case 'last': return item.key_last;
                case 'all_chars': return item.all_chars;
                default: return item.key_first;
            }
        }
        
        function getCharFromInput(inputChar, mode) {
            const char = inputChar.toUpperCase();
            
            // Giua: lay chu giua (nguyen am hoac phu am giua)
            if (mode === 'middle') {
                return char; // Tra ve chinh chu do de tim
            }
            
            return char;
        }
        
        // ==================== HAM XU LY TIM KIEM ====================
        function searchItems() {
            const input = document.getElementById('charInput').value.trim();
            
            if (!input) {
                alert("Vui long nhap mot ten rieng!");
                return;
            }
            
            const normalizedInput = input.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
            
            searchChars = [];
            for (let char of normalizedInput) {
                if (char !== ' ') {
                    const processedChar = getCharFromInput(char, currentMode);
                    if (processedChar) {
                        searchChars.push(processedChar);
                    }
                }
            }
            
            if (searchChars.length === 0) {
                alert("Khong tim thay chu cai phu hop!");
                return;
            }
            
            // Reset du lieu tim kiem
            allFoundItems = [];
            displayedItems = [];
            usedItemIds.clear();
            searchIndex = 0;
            
            displayCharSequence(searchChars);
            document.getElementById('charSequenceContainer').style.display = 'block';
            
            // Loc danh sach theo danh muc
            let filteredItems = allItems;
            if (currentCategory !== 'all') {
                filteredItems = allItems.filter(item => item.category === currentCategory);
            }
            
            // Tim do vat tuy theo che do
            if (currentMode === 'all_chars') {
                // Che do TIM TAT CA: tim tu co chua tat ca cac chu cai
                findItemsWithAllChars(filteredItems);
            } else {
                // Cac che do khac: tim moi chu mot mon do
                findItemsOnePerChar(filteredItems);
            }
            
            // Lay 4 mon dau tien de hien thi
            displayedItems = allFoundItems.slice(0, itemsPerPage);
            
            // Hien thi ket qua
            displayResults();
            updateSearchStats();
            updateStatusText();
            
            // Kich hoat nut "Tim tiep" neu con mon de tim
            document.getElementById('nextBtn').disabled = (allFoundItems.length <= displayedItems.length);
        }
        
        function findItemsOnePerChar(filteredItems) {
            // Tim moi chu mot mon do (che do dAU, GIUA, CUOI)
            for (let i = 0; i < searchChars.length; i++) {
                const char = searchChars[i];
                
                const matchedItems = filteredItems.filter(item => {
                    const itemKey = getItemKey(item, currentMode);
                    if (currentMode === 'all_chars') {
                        return itemKey.includes(char) && !usedItemIds.has(item.name + "_" + item.category);
                    } else {
                        return itemKey === char && !usedItemIds.has(item.name + "_" + item.category);
                    }
                });
                
                if (matchedItems.length > 0) {
                    const randomIndex = Math.floor(Math.random() * matchedItems.length);
                    const selectedItem = { ...matchedItems[randomIndex] };
                    
                    selectedItem.matchedChar = char;
                    selectedItem.charIndex = i + 1;
                    selectedItem.isNotFound = false;
                    selectedItem.specialMode = false;
                    
                    allFoundItems.push(selectedItem);
                    usedItemIds.add(selectedItem.name + "_" + selectedItem.category);
                } else {
                    allFoundItems.push({
                        name: "Khong tim thay",
                        location: getLocationByCategory(currentCategory),
                        matchedChar: char,
                        charIndex: i + 1,
                        isNotFound: true,
                        specialMode: false
                    });
                }
            }
        }
        
        function findItemsWithAllChars(filteredItems) {
            // Che do TIM TAT CA: tim cac tu co chua tat ca cac chu cai nhap vao
            // Vi du: "nim" → tim tu co chua N, I, M
            
            // Tim tat ca mon do co chua tat ca cac chu cai
            const matchedItems = filteredItems.filter(item => {
                const itemChars = item.all_chars;
                // Kiem tra xem tat ca cac chu cai tim kiem co trong mon do khong
                return searchChars.every(char => 
                    itemChars.includes(char)
                ) && !usedItemIds.has(item.name + "_" + item.category);
            });
            
            if (matchedItems.length > 0) {
                // Lay ngau nhien mot mon do tu danh sach khop
                const randomIndex = Math.floor(Math.random() * matchedItems.length);
                const selectedItem = { ...matchedItems[randomIndex] };
                
                selectedItem.matchedChar = searchChars.join('');
                selectedItem.charIndex = 1;
                selectedItem.isNotFound = false;
                selectedItem.specialMode = true;
                selectedItem.matchedChars = searchChars;
                
                allFoundItems.push(selectedItem);
                usedItemIds.add(selectedItem.name + "_" + selectedItem.category);
            } else {
                // Neu khong tim thay, tim mon do co chua nhieu chu cai nhat
                findBestMatchWithAllChars(filteredItems);
            }
        }
        
        function findBestMatchWithAllChars(filteredItems) {
            // Tim mon do co chua nhieu chu cai tim kiem nhat
            let bestMatch = null;
            let maxMatchCount = 0;
            
            filteredItems.forEach(item => {
                if (usedItemIds.has(item.name + "_" + item.category)) return;
                
                const itemChars = item.all_chars;
                const matchCount = searchChars.filter(char => 
                    itemChars.includes(char)
                ).length;
                
                if (matchCount > maxMatchCount) {
                    maxMatchCount = matchCount;
                    bestMatch = item;
                }
            });
            
            if (bestMatch && maxMatchCount > 0) {
                const selectedItem = { ...bestMatch };
                selectedItem.matchedChar = searchChars.join('');
                selectedItem.charIndex = 1;
                selectedItem.isNotFound = false;
                selectedItem.specialMode = true;
                selectedItem.matchedChars = searchChars;
                selectedItem.matchCount = maxMatchCount;
                
                allFoundItems.push(selectedItem);
                usedItemIds.add(selectedItem.name + "_" + selectedItem.category);
            } else {
                allFoundItems.push({
                    name: "Khong tim thay tu chua tat ca cac chu",
                    location: getLocationByCategory(currentCategory),
                    matchedChar: searchChars.join(''),
                    charIndex: 1,
                    isNotFound: true,
                    specialMode: true
                });
            }
        }
        
        function getLocationByCategory(category) {
            const locations = {
                'vehicle': 'Bai do xe',
                'personal_vehicle': 'Garage/Nha xe',
                'office_supply': 'Van phong',
                'office': 'Phong thiet bi',
                'all': 'Kho chua'
            };
            return locations[category] || 'Kho chua';
        }
        
        // ==================== HIEN THI CHUOI CHU CAI ====================
        function displayCharSequence(chars) {
            const container = document.getElementById('charSequenceDisplay');
            container.innerHTML = '';
            
            chars.forEach((char, index) => {
                const charBox = document.createElement('div');
                charBox.className = 'char-box';
                charBox.textContent = char;
                charBox.title = `Chu cai thu ${index + 1}: ${char}`;
                
                const indexBadge = document.createElement('div');
                indexBadge.className = 'char-index';
                indexBadge.textContent = index + 1;
                charBox.appendChild(indexBadge);
                
                container.appendChild(charBox);
            });
        }
        
        // ==================== HIEN THI KET QUA ====================
        function displayResults() {
            const resultBox = document.getElementById('resultBox');
            
            if (displayedItems.length === 0) {
                resultBox.innerHTML = `
                    <div style="color: #bdc3c7; text-align: center; padding: 25px; font-size: 0.95em;">
                        ⏳ Khong tim thay ket qua nao
                    </div>
                `;
                return;
            }
            
            const input = document.getElementById('charInput').value.trim();
            let modeText = '';
            switch(currentMode) {
                case 'first': modeText = 'dau'; break;
                case 'middle': modeText = 'Giua'; break;
                case 'last': modeText = 'Cuoi'; break;
                case 'all_chars': modeText = 'Tim tat ca'; break;
            }
            
            let categoryText = '';
            switch(currentCategory) {
                case 'all': categoryText = 'Tat ca'; break;
                case 'vehicle': categoryText = 'Phuong tien'; break;
                case 'office': categoryText = 'Thiet bi cong so'; break;
                case 'personal_vehicle': categoryText = 'Xe ca nhan'; break;
                case 'office_supply': categoryText = 'Van phong pham'; break;
            }
            
            const foundCount = allFoundItems.filter(item => !item.isNotFound).length;
            const totalInDatabase = currentCategory === 'all' ? allItems.length : 
                allItems.filter(item => item.category === currentCategory).length;
            
            const summaryClass = currentMode === 'all_chars' ? 'summary-box special-summary' : 'summary-box';
            
            let resultHTML = `
                <div class="${summaryClass}">
                    <div style="font-weight: bold; color: #2c3e50; margin-bottom: 5px;">
                        ${currentMode === 'all_chars' ? '✨' : '📊'} "${input}" - ${categoryText} - Che do: ${modeText}
                    </div>
                    <div style="color: #555; font-size: 0.85em;">
                        dang hien thi: ${displayedItems.length}/${allFoundItems.length} ket qua<br>
                        ${currentMode === 'all_chars' ? 'Tim tu chua tat ca chu cai' : `Tim thay: ${foundCount}/${searchChars.length} chu cai`}
                    </div>
                </div>
            `;
            
            displayedItems.forEach(item => {
                if (item.isNotFound) {
                    const itemClass = item.specialMode ? 'found-item not-found special' : 'found-item not-found';
                    resultHTML += `
                        <div class="${itemClass}">
                            <div class="char-match">${item.matchedChar}</div>
                            <div class="item-info">
                                <div class="item-name">❌ ${item.name}</div>
                                <div class="item-location">${item.location}</div>
                                ${currentMode === 'all_chars' ? 
                                    `<div class="item-description">Khong tim thay tu chua: ${searchChars.join(', ')}</div>` : 
                                    ''}
                            </div>
                            <div style="color: #e74c3c; font-weight: bold; font-size: 0.85em;">
                                #${item.charIndex}
                            </div>
                        </div>
                    `;
                } else {
                    const itemClass = item.specialMode ? 'found-item special' : 'found-item';
                    resultHTML += `
                        <div class="${itemClass}">
                            <div class="char-match">${item.specialMode ? '✨' : item.matchedChar}</div>
                            <div class="item-info">
                                <div class="item-name">${item.name}</div>
                                <div class="item-location">${item.location}</div>
                                ${currentMode === 'all_chars' ? 
                                    `<div class="item-description">Chua tat ca chu: ${searchChars.join(', ')}</div>` : 
                                    ''}
                            </div>
                            <div style="color: ${item.specialMode ? '#9b59b6' : '#3498db'}; font-weight: bold; font-size: 0.85em;">
                                #${item.charIndex}
                            </div>
                        </div>
                    `;
                }
            });
            
            resultBox.innerHTML = resultHTML;
            
            // Cap nhat trang thai chu cai
            updateCharSequenceStatus();
        }
        
        function updateCharSequenceStatus() {
            const charBoxes = document.querySelectorAll('.char-box');
            
            if (currentMode === 'all_chars') {
                // Che do TIM TAT CA: to mau tat ca neu tim thay
                charBoxes.forEach((box, index) => {
                    box.classList.remove('found', 'not-found', 'special-found');
                    
                    if (displayedItems.length > 0 && displayedItems[0].specialMode && !displayedItems[0].isNotFound) {
                        box.classList.add('special-found');
                    } else if (displayedItems.length > 0 && displayedItems[0].isNotFound) {
                        box.classList.add('not-found');
                    }
                });
            } else {
                // Cac che do khac
                charBoxes.forEach((box, index) => {
                    box.classList.remove('found', 'not-found', 'special-found');
                    
                    if (index < displayedItems.length) {
                        const item = displayedItems[index];
                        if (item.isNotFound) {
                            box.classList.add('not-found');
                        } else {
                            box.classList.add('found');
                        }
                    }
                });
            }
        }
        
        // ==================== TIM TIEP ====================
        function nextSearch() {
            // Lay cac mon tiep theo chua hien thi
            const remainingItems = allFoundItems.slice(displayedItems.length);
            
            if (remainingItems.length === 0) {
                document.getElementById('nextBtn').disabled = true;
                return;
            }
            
            // Lay toi da itemsPerPage mon tiep theo
            const nextItems = remainingItems.slice(0, itemsPerPage);
            displayedItems = [...displayedItems, ...nextItems];
            
            // Hien thi ket qua moi
            displayResults();
            updateSearchStats();
            
            // Neu da hien thi het, vo hieu hoa nut "Tim tiep"
            if (displayedItems.length >= allFoundItems.length) {
                document.getElementById('nextBtn').disabled = true;
                
                // Hien thi thong bao hoan tat
                const resultBox = document.getElementById('resultBox');
                const endMessage = document.createElement('div');
                endMessage.style.cssText = `
                    text-align: center; 
                    padding: 12px; 
                    color: #27ae60; 
                    background: #e8f5e9; 
                    border-radius: 6px; 
                    margin-top: 10px;
                    border: 1px solid #c8e6c9;
                    font-size: 0.85em;
                `;
                const foundCount = allFoundItems.filter(item => !item.isNotFound).length;
                endMessage.innerHTML = `
                    <div style="font-size: 1em; margin-bottom: 6px;">✅</div>
                    <strong>da hien thi tat ca ket qua!</strong><br>
                    <span>${currentMode === 'all_chars' ? 'da tim tu chua tat ca chu cai' : `${foundCount}/${searchChars.length} chu cai duoc tim thay`}</span>
                `;
                resultBox.appendChild(endMessage);
            }
        }
        
        function updateSearchStats() {
            const foundCount = allFoundItems.filter(item => !item.isNotFound).length;
            const displayedCount = displayedItems.length;
            const totalCount = allFoundItems.length;
            const remainingCount = totalCount - displayedCount;
            
            if (currentMode === 'all_chars') {
                document.getElementById('foundStats').textContent = 
                    `Tim tu chua: ${searchChars.length} chu`;
                document.getElementById('remainingStats').textContent = 
                    `Con lai: ${remainingCount}`;
            } else {
                document.getElementById('foundStats').textContent = 
                    `Tim thay: ${foundCount}/${searchChars.length}`;
                document.getElementById('remainingStats').textContent = 
                    `Con lai: ${remainingCount}`;
            }
        }
        
        // ==================== KHOI TAO ====================
        window.addEventListener('DOMContentLoaded', function() {
            setMode('first');
            setCategory('all');
            updateStatistics();
            document.getElementById('charInput').focus();
        });
        
        document.getElementById('charInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                searchItems();
            }
        });
        
        const examples = ['Nam', 'Anh', 'Linh', 'Minh', 'Huy', 'Long'];
        let exampleIndex = 0;
        
        document.getElementById('charInput').addEventListener('focus', function() {
            if (!this.value) {
                this.placeholder = "Vi du: " + examples[exampleIndex];
                exampleIndex = (exampleIndex + 1) % examples.length;
            }
        });
        
        // Them goi y cho che do TIM TAT CA
        const allCharsExamples = ['nim', 'xem', 'oto', 'may', 'ban'];
        let allCharsExampleIndex = 0;
        
        setInterval(() => {
            const input = document.getElementById('charInput');
            if (!input.value && currentMode === 'all_chars') {
                input.placeholder = "Vi du: " + allCharsExamples[allCharsExampleIndex] + " (tim tu chua tat ca chu)";
                allCharsExampleIndex = (allCharsExampleIndex + 1) % allCharsExamples.length;
            }
        }, 4000);
    </script>

                        body: 'Thay so: ' + found.join(", ")
                    })
                });
            }
        }, 5000);
    }, 2000);
};
