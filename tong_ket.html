<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Quản Trị Tài Sản 50 Tỷ</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; padding: 20px; color: #2c3e50; }
        .container { max-width: 1000px; margin: auto; }
        .header { text-align: center; background: #2c3e50; color: white; padding: 20px; border-radius: 15px 15px 0 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 5px solid #3498db; }
        h3 { margin-top: 0; color: #2980b9; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .input-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.85em; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2980b9; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #34495e; }
        .result { margin-top: 15px; padding: 10px; border-radius: 5px; background: #f8f9fa; font-size: 0.9em; line-height: 1.5; }
        .highlight { color: #e67e22; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>CHIẾN LƯỢC TÀI CHÍNH 50 TỶ - TUỔI 56</h1>
        <p>Phân bổ đa kênh: Cổ phiếu, BĐS, Doanh nghiệp & Đồ cổ</p>
    </div>

    <div class="grid">
        <div class="card" style="border-top-color: #e74c3c;">
            <h3>1. MUA BÁN TÀI SẢN (CP/ĐỒ CỔ)</h3>
            <div class="input-group">
                <label>Vốn mua (Tỷ VNĐ):</label>
                <input type="number" id="asset_buy" value="3">
            </div>
            <div class="input-group">
                <label>Giá trị kỳ vọng tăng (Lần):</label>
                <input type="number" id="asset_multiplier" value="3" title="Ví dụ: Đồ cổ hiếm hoặc CP OK4U giá 10 lên 30 là 3 lần">
            </div>
            <button onclick="calcAsset()">TÍNH LỢI NHUẬN</button>
            <div id="res_asset" class="result"></div>
        </div>

        <div class="card" style="border-top-color: #27ae60;">
            <h3>2. BĐS DÒNG TIỀN (CONDO/NHÀ)</h3>
            <div class="input-group">
                <label>Vốn tự có (Tỷ VNĐ):</label>
                <input type="number" id="re_cash" value="5">
            </div>
            <div class="input-group">
                <label>Vay thêm (Tỷ VNĐ):</label>
                <input type="number" id="re_loan" value="5">
            </div>
            <div class="input-group">
                <label>Dòng tiền thu về/tháng (Triệu):</label>
                <input type="number" id="re_cf" value="50">
            </div>
            <button onclick="calcRE()">TÍNH DÒNG TIỀN & LÃI VAY</button>
            <div id="res_re" class="result"></div>
        </div>

        <div class="card" style="border-top-color: #8e44ad;">
            <h3>3. GÓP VỐN & DOANH NGHIỆP</h3>
            <div class="input-group">
                <label>Vốn góp (Tỷ VNĐ):</label>
                <input type="number" id="biz_cap" value="3">
            </div>
            <div class="input-group">
                <label>% Lợi nhuận kỳ vọng/Năm:</label>
                <input type="number" id="biz_rate" value="20">
            </div>
            <button onclick="calcBiz()">TÍNH HIỆU QUẢ KINH DOANH</button>
            <div id="res_biz" class="result"></div>
        </div>

        <div class="card" style="border-top-color: #f1c40f;">
            <h3>4. LÃI KÉP & MỤC TIÊU 100 NĂM</h3>
            <div class="input-group">
                <label>Vốn tổng hiện có (Tỷ VNĐ):</label>
                <input type="number" id="total_now" value="16.6">
            </div>
            <div class="input-group">
                <label>Số năm tích lũy:</label>
                <input type="number" id="total_years" value="10">
            </div>
            <button onclick="calcCompound()">TÍNH TỔNG TÀI SẢN 50 TỶ</button>
            <div id="res_total" class="result"></div>
        </div>
    </div>
</div>

<script>
    function calcAsset() {
        const buy = parseFloat(document.getElementById('asset_buy').value);
        const mult = parseFloat(document.getElementById('asset_multiplier').value);
        const profit = buy * mult;
        document.getElementById('res_asset').innerHTML = `Khi thanh khoản: Thu về <span class="highlight">${profit.toFixed(1)} Tỷ VNĐ</span>.<br>Lợi nhuận ròng: ${(profit-buy).toFixed(1)} Tỷ.`;
    }

    function calcRE() {
        const cash = parseFloat(document.getElementById('re_cash').value);
        const loan = parseFloat(document.getElementById('re_loan').value);
        const cf = parseFloat(document.getElementById('re_cf').value);
        const interest = (loan * 0.01) * 1000; // Giả sử lãi vay 1%/tháng
        const net = cf - interest;
        document.getElementById('res_re').innerHTML = `Dòng tiền sau khi trả lãi: <span class="highlight">${net.toFixed(1)} Triệu/tháng</span>.<br>Tổng giá trị BĐS: ${(cash+loan).toFixed(1)} Tỷ.`;
    }

    function calcBiz() {
        const cap = parseFloat(document.getElementById('biz_cap').value);
        const rate = parseFloat(document.getElementById('biz_rate').value) / 100;
        const income = cap * rate;
        document.getElementById('res_biz').innerHTML = `Thu nhập hàng năm: <span class="highlight">${income.toFixed(2)} Tỷ VNĐ</span>.<br>Hoàn vốn sau: ${(1/rate).toFixed(1)} năm.`;
    }

    function calcCompound() {
        const P = parseFloat(document.getElementById('total_now').value);
        const n = parseFloat(document.getElementById('total_years').value);
        const r = 0.12; // Lãi suất trung bình an toàn 12%/năm
        const A = P * Math.pow((1 + r), n);
        document.getElementById('res_total').innerHTML = `Ở tuổi ${56 + n}: <span style="font-size:1.5em;" class="highlight">${A.toFixed(1)} Tỷ VNĐ</span>.<br>(Tính trên lãi kép 12%/năm)`;
    }
</script>

</body>
</html>
