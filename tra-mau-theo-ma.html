<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinh Tuoi & Mau Sac Quan Ao</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #4a6fa5;
            grid-column: 1 / -1;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .description {
            color: #555;
            font-size: 1.1rem;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .input-section {
            background-color: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        
        .result-section {
            background-color: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            border-color: #4a6fa5;
            outline: none;
        }
        
        .color-preview {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
            border: 1px solid #ddd;
        }
        
        button {
            background-color: #4a6fa5;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.3s;
            width: 100%;
            margin-top: 10px;
        }
        
        button:hover {
            background-color: #3a5a80;
        }
        
        .results-container {
            margin-top: 20px;
        }
        
        .result-item {
            background-color: #f8f9fa;
            border-left: 4px solid #4a6fa5;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 0 6px 6px 0;
        }
        
        .result-title {
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        
        .color-result {
            display: flex;
            align-items: center;
            margin: 10px 0;
            padding: 10px;
            background-color: white;
            border-radius: 6px;
            border: 1px solid #eaeaea;
        }
        
        .clothing-item {
            padding: 8px 12px;
            background-color: #eef5ff;
            border-radius: 4px;
            margin: 5px 0;
            border-left: 3px solid #4a6fa5;
        }
        
        .person-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-top: 10px;
        }
        
        .person-item {
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .person-item:hover {
            background-color: #f0f7ff;
        }
        
        .person-item:last-child {
            border-bottom: none;
        }
        
        .person-name {
            font-weight: 600;
            color: #2c3e50;
        }
        
        .person-dob {
            color: #666;
            font-size: 0.9rem;
        }
        
        .explanation {
            font-style: italic;
            color: #555;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 0.95rem;
        }
        
        .highlight {
            background-color: #fffacd;
            padding: 3px 6px;
            border-radius: 3px;
            font-weight: 600;
        }
        
        .time-unit {
            color: #4a6fa5;
            font-weight: 700;
        }
        
        .color-name {
            font-weight: 600;
            margin-left: 10px;
        }
        
        .hex-code {
            background-color: #f0f0f0;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: monospace;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Ung Dung Tinh Tuoi & Mau Sac Quan Ao</h1>
        <p class="description">Nhap thong tin hoac chon tu danh sach de tinh tuoi theo nhieu don vi thoi gian va nhan de xuat mau sac quan ao phu hop.</p>
    </header>
    
    <div class="container">

            </div>
            
            <div class="form-group">
                <label for="birthDate">Ngay thang nam sinh:</label>

            </div>
            
            <div class="form-group">
                <label for="name">Ho va ten:</label>

            <div class="form-group">

                    <!-- Danh sach nguoi se duoc tao bang JavaScript -->

            <button id="calculateBtn">Tinh toan va de xuat</button>

        <div class="result-section">

            <div id="resultsContainer" class="results-container">
                <p>Vui long nhap thong tin va nhan "Tinh toan va de xuat" de xem ket qua.</p>

            "GHI": ["AO SOMI KE DEN TO", "CAVAT GHI 06 27", "QUAN DAI TRANG COMPLE", "AO FONG TRANG NGUA BONG", "AO SAT NACH GHI MOI", "AO KHOAC GHI DEN Khoa hong", "AO JILE GHI 26", "AO BU DONG GHI", "AO LEN GHI", "AO SOI LONG GHI TRANG", "COMPLE GUONG", "BO TDTT GHI", "QUAN THUN GHI", "QUAN NGU GHI 1", "QUAN NGU GHI 2"],

        // Giai thich mau sac theo cam xuc, hoan canh
        const colorExplanations = {

        // Khoi tao ngay hien tai
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date();
            const formattedDate = today.toISOString().split('T')[0];
            document.getElementById('currentDate').value = formattedDate;
            
            // Tao danh sach nguoi
            const personList = document.getElementById('personList');
            people.forEach(person => {
                const personItem = document.createElement('div');
                personItem.className = 'person-item';
                personItem.innerHTML = `
                    <div class="person-name">${person.id}. ${person.name}</div>
                    <div class="person-dob">Ngay sinh: ${formatDateForDisplay(person.dob)}</div>
                `;
                
                personItem.addEventListener('click', function() {
                    document.getElementById('name').value = person.name;
                    document.getElementById('birthDate').value = person.dob;
                });
                
                personList.appendChild(personItem);
            });
            
            // Xu ly khi nhan nut tinh toan
            document.getElementById('calculateBtn').addEventListener('click', calculateAndDisplay);
        });

        // Ham dinh dang ngay thang de hien thi
        function formatDateForDisplay(dateString) {
            const date = new Date(dateString);
            return date.getDate().toString().padStart(2, '0') + '/' + 
                   (date.getMonth() + 1).toString().padStart(2, '0') + '/' + 
                   date.getFullYear();
        }

        // Ham tinh toan va hien thi ket qua
        function calculateAndDisplay() {
            const currentDate = document.getElementById('currentDate').value;
            const birthDate = document.getElementById('birthDate').value;
            const name = document.getElementById('name').value;
            
            if (!currentDate || !birthDate || !name) {
                alert('Vui long nhap day du thong tin hoac chon tu danh sach');
                return;
            }
            
            // Tinh toan cac loai tuoi
            const ageInYears = calculateAgeInYears(birthDate, currentDate);
            const ageInMonths = calculateAgeInMonths(birthDate, currentDate);
            const ageInWeeks = calculateAgeInWeeks(birthDate, currentDate);
            const ageInDays = calculateAgeInDays(birthDate, currentDate);
            const ageInHours = calculateAgeInHours(birthDate, currentDate);
            
            // Tinh toan ma mau cho tung loai tuoi
            const yearColorIndex = getColorIndex(ageInYears);
            const monthColorIndex = getColorIndex(ageInMonths);
            const weekColorIndex = getColorIndex(ageInWeeks);
            const dayColorIndex = getColorIndex(ageInDays);
            const hourColorIndex = getColorIndex(ageInHours);
            
            // Lay mau tu cac bang
            const yearColor = colorTables[0][yearColorIndex - 1];
            const monthColor = colorTables[1][monthColorIndex - 1];
            const weekColor = colorTables[2][weekColorIndex - 1];
            const dayColor = colorTables[3][dayColorIndex - 1];
            const hourColor = colorTables[4][hourColorIndex - 1];

            const monthClothing = clothingTable[monthColor] || ["Khong co de xuat"];
            const weekClothing = clothingTable[weekColor] || ["Khong co de xuat"];
            const dayClothing = clothingTable[dayColor] || ["Khong co de xuat"];
            const hourClothing = clothingTable[hourColor] || ["Khong co de xuat"];
            
            // Hien thi ket qua
            displayResults(name, birthDate, currentDate, {
                years: { value: ageInYears, color: yearColor, clothing: yearClothing },
                months: { value: ageInMonths, color: monthColor, clothing: monthClothing },
                weeks: { value: ageInWeeks, color: weekColor, clothing: weekClothing },
                days: { value: ageInDays, color: dayColor, clothing: dayClothing },
                hours: { value: ageInHours, color: hourColor, clothing: hourClothing }
            });
        }

        // Tinh tuoi theo nam
        function calculateAgeInYears(birthDate, currentDate) {
            const birth = new Date(birthDate);
            const current = new Date(currentDate);
            
            let years = current.getFullYear() - birth.getFullYear();
            const monthDiff = current.getMonth() - birth.getMonth();
            
            if (monthDiff < 0 || (monthDiff === 0 && current.getDate() < birth.getDate())) {
                years--;
            }
            
            return years;
        }

        // Tinh tuoi theo thang
        function calculateAgeInMonths(birthDate, currentDate) {
            const birth = new Date(birthDate);
            const current = new Date(currentDate);
            
            let months = (current.getFullYear() - birth.getFullYear()) * 12;
            months += current.getMonth() - birth.getMonth();
            
            if (current.getDate() < birth.getDate()) {
                months--;
            }
            
            return months;
        }

        // Tinh tuoi theo tuan
        function calculateAgeInWeeks(birthDate, currentDate) {
            const birth = new Date(birthDate);
            const current = new Date(currentDate);
            
            const diffTime = Math.abs(current - birth);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            return Math.floor(diffDays / 7);
        }

        // Tinh tuoi theo ngay
        function calculateAgeInDays(birthDate, currentDate) {
            const birth = new Date(birthDate);
            const current = new Date(currentDate);
            
            const diffTime = Math.abs(current - birth);
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        // Tinh tuoi theo gio
        function calculateAgeInHours(birthDate, currentDate) {
            const birth = new Date(birthDate);
            const current = new Date(currentDate);
            
            const diffTime = Math.abs(current - birth);
            return Math.floor(diffTime / (1000 * 60 * 60));
        }

        // Tinh chi so mau dua tren gia tri tuoi
        function getColorIndex(ageValue) {
            let result = ageValue % 12;
            return result === 0 ? 12 : result;
        }

        // Hien thi ket qua
        function displayResults(name, birthDate, currentDate, results) {
